<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>9th Board Test Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<style>
/* Layout: an exam answer sheet. Paper surface, ink text, OMR bubbles, one narrow reading column. */
:root{
  --paper:#FBFAF6; --sheet:#FFFFFF; --ink:#17233B; --muted:#5D6678; --line:#DCDDE3;
  --accent:#1D5C4D; --accent-soft:#E2EFEA; --bubble:#C9CDD8;
  --good:#1F7A45; --good-bg:#E4F3EA; --warn:#9A6400; --warn-bg:#FBF0D9; --bad:#B23A3A; --bad-bg:#FBE6E6;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161F; --sheet:#1A2030; --ink:#E7E9EF; --muted:#9AA2B4; --line:#2E3547;
  --accent:#6CC3A8; --accent-soft:#1D3530; --bubble:#4A5368;
  --good:#6FD39A; --good-bg:#16301F; --warn:#E8B860; --warn-bg:#33280F; --bad:#F08A8A; --bad-bg:#3A1C1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161F; --sheet:#1A2030; --ink:#E7E9EF; --muted:#9AA2B4; --line:#2E3547;
  --accent:#6CC3A8; --accent-soft:#1D3530; --bubble:#4A5368;
  --good:#6FD39A; --good-bg:#16301F; --warn:#E8B860; --warn-bg:#33280F; --bad:#F08A8A; --bad-bg:#3A1C1C; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.7rem,4.5vw,2.3rem)}
h2{font-size:1.35rem}
h3{font-size:1.08rem}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1.5px solid var(--accent);background:var(--accent);color:var(--sheet);padding:10px 18px;border-radius:8px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header.top{display:flex;flex-direction:column;gap:6px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px}
.tests{display:grid;gap:14px}
.tcard{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.tcard>div{min-width:0}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--muted)}
table.hist{width:100%;border-collapse:collapse;font-size:.92rem}
table.hist th,table.hist td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.hist th{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tablebox{overflow-x:auto}
.pill{font-size:.76rem;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)}
/* test view */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding-block:10px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.prog{flex:1;min-width:140px;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);width:0}
.timer{font-family:var(--f-mono);font-size:1rem}
.timer.low{color:var(--bad)}
.q{display:grid;grid-template-columns:2.2rem 1fr;gap:4px 10px;padding-block:16px;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.qt[lang="ur"],.opts[lang="ur"],.expl[lang="ur"],.sq [lang="ur"]{font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;line-height:1.9}
[lang="ur"] .opt{text-align:right}
.qn{font-family:var(--f-mono);color:var(--muted);padding-top:2px}
.qt{font-family:var(--f-display);font-size:1.07rem;font-weight:500;min-width:0}
.opts{grid-column:2;display:grid;gap:8px;margin-top:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.bub{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--bubble);display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .bub{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt:disabled{cursor:default}
.expl{grid-column:2;font-size:.92rem;margin-top:8px;padding:8px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0}
.tag{grid-column:2;font-size:.75rem;color:var(--muted);margin-top:4px}
.score{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.big{font-family:var(--f-mono);font-size:2.6rem;line-height:1}
.verdict{padding:12px 14px;border-radius:8px;font-weight:500}
.v-good{background:var(--good-bg);color:var(--good)} .v-warn{background:var(--warn-bg);color:var(--warn)} .v-bad{background:var(--bad-bg);color:var(--bad)}
ol.sq{margin:0;padding-left:1.4rem;display:grid;gap:10px}
ol.sq li{padding-left:4px}
.marks{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);white-space:nowrap}
details.guide{border:1px dashed var(--warn);border-radius:8px;padding:10px 14px;background:var(--warn-bg)}
details.guide summary{cursor:pointer;font-weight:600;color:var(--warn)}
.guide ul{margin:6px 0 0;padding-left:1.2rem}
.field{display:flex;flex-direction:column;gap:4px}
.field input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink);width:7rem}
.note{font-size:.88rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:20}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:4px;padding:14px}
.tv{font-family:var(--f-mono);font-size:1.7rem;line-height:1.1}
.tv .muted{font-size:1rem}
.t-good .tv{color:var(--good)} .t-warn .tv{color:var(--warn)} .t-bad .tv{color:var(--bad)}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:8.5rem 1fr 3rem auto;gap:10px;align-items:center}
.bl{font-weight:500;min-width:0}
.track{position:relative;height:12px;background:var(--line);border-radius:6px;overflow:visible}
.track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.track .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.55}
.mk60{left:60%} .mk80{left:80%}
.bv{text-align:right}
svg.chart{width:100%;min-width:420px;height:auto;display:block}
svg .gl{stroke:var(--line);stroke-width:1} svg .gl.ref{stroke-dasharray:4 4;stroke:var(--muted);opacity:.6}
svg .ax{fill:var(--muted);font:11px var(--f-mono)} svg .lbl{fill:var(--ink);font:600 12px var(--f-mono)}
svg .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
svg .dot{fill:var(--accent);stroke:var(--sheet);stroke-width:2} svg .hit{fill:transparent}
svg .pt:hover .dot,svg .pt:focus .dot{r:6.5}
.btn.sm{padding:5px 10px;font-size:.85rem}
a.btn{text-decoration:none;display:inline-block}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.barrow{grid-template-columns:6.5rem 1fr 2.6rem}.barrow .pill{display:none}}
@media (prefers-reduced-motion:no-preference){.prog>i{transition:width .25s}}
@media (max-width:480px){.tcard{grid-template-columns:1fr}.score{grid-template-columns:1fr}}
</style>
</head>

ces."],["Understanding life through chemical processes is the study of:",["Biochemistry","Geochemistry","Inorganic chemistry","Astrochemistry"],0,"Biochemistry studies chemical substances and vital processes in living organisms."],["Radioactivity and reactions in the nucleus of an atom are studied in:",["Nuclear chemistry","Physical chemistry","Environmental chemistry","Biochemistry"],0,"Nuclear chemistry deals with reactions taking place in the nucleus."],["Proteins, cellulose and nucleic acids are examples of:",["naturally occurring polymers","man-made polymers","inorganic salts","minerals"],0,"Book: proteins, cellulose and nucleic acids are naturally occurring polymers."],["The study of molecules and ions in space and interstellar space is:",["Astrochemistry","Geochemistry","Medicinal chemistry","Physical chemistry"],0,"Astrochemistry studies atoms, molecules and ions in the universe."],["Designing and synthesising medicines is the work of:",["Medicinal chemistry","Geochemistry","Polymer chemistry","Analytical chemistry"],0,"Medicinal chemistry includes discovery, delivery, absorption and metabolism of drugs."],["The chemical composition of the Earth and its minerals is studied in:",["Geochemistry","Astrochemistry","Biochemistry","Nuclear chemistry"],0,"Geochemistry is the study of the chemical composition of Earth."],["You study the rate of hydrolysis of starch at different temperatures. This falls under:",["Physical chemistry","Organic chemistry","Analytical chemistry","Biochemistry"],0,"Book exercise: rates of reactions belong to physical chemistry."],["Hazardous effects of shopping bags are studied in:",["Environmental chemistry","Geochemistry","Inorganic chemistry","Analytical chemistry"],0,"Book exercise: pollution effects belong to environmental chemistry."],["The man-made polymer is:",["Polystyrene","Starch","Protein","Cellulose"],0,"Book exercise: polystyrene is synthetic; the others are natural polymers."]]},

"chem2.1":{"s":"Chemistry","label":"Ch 2.1: Idea of the atom, discharge tube, discovery of electron and proton","q":[["The idea of the atom was first proposed in Greece by:",["Democritus","Dalton","Thomson","Bohr"],0,"Book 2.1."],["Around 1800, evidence for the existence of atoms was provided by:",["John Dalton","Democritus","Rutherford","Goldstein"],0,"Book 2.1."],["Discharge tube experiments showed that atoms contain:",["electrons and protons","only neutrons","no smaller particles","only nuclei"],0,"Book exercise MCQ (ii)."],["A proton is about how many times heavier than an electron?",["1836","18","100","1000"],0,"Book 2.1."],["In a discharge tube, negatively charged particles bend towards the:",["positive plate","negative plate","magnet's north pole only","glass wall"],0,"Book 2.1."],["Cathode rays were studied in 1897 by:",["J.J. Thomson","Goldstein","Bohr","Democritus"],0,"Book: British physicist Joseph John Thomson."],["Cathode rays bent towards the positive plate, showing they carry:",["negative charge","positive charge","no charge","double charge"],0,"Book 2.1."],["Thomson used his experiments to calculate the cathode rays':",["mass to charge ratio","speed of light","atomic number","density"],0,"Book 2.1."],["Positively charged particles were first observed in 1886 by:",["E. Goldstein","J.J. Thomson","Rutherford","Bohr"],0,"Book: Discovery of proton."],["Goldstein used a discharge tube with a:",["perforated cathode","perforated anode","gold foil","magnet"],0,"Book: discovery of proton."],["Goldstein called the new rays:",["canal rays or anode rays","cathode rays","gamma rays","X-rays"],0,"Book."],["In 1917, experiments showing the hydrogen nucleus is present in other nuclei were done by:",["Rutherford","Thomson","Dalton","Bohr"],0,"Book."],["The gas in a discharge tube is kept at:",["very low pressure","very high pressure","normal pressure","zero temperature"],0,"Book: high voltage at very low pressure."],["Why did scientists conclude electrons are present "chem2.2":{"s":"Chemistry","label":"Ch 2.1: Neutron, nucleus, particle masses and charges, Bohr's model","q":[["The neutron was discovered (book) in:",["1933","1897","1886","1911"],0,"Book: in 1933 the neutron was discovered."],["The neutron carries:",["no charge","a positive charge","a negative charge","double positive charge"],0,"Book."],["The mass of a neutron is:",["almost the same as that of a proton","the same as an electron","half of a proton","1836 times a proton"],0,"Book."],["Which atom does not have a neutron?",["Ordinary hydrogen","Helium","Carbon","Oxygen"],0,"Book: ordinary hydrogen has no neutron."],["Rutherford discovered the nucleus in 1911 by firing particles at a thin:",["gold foil","copper wire","glass sheet","iron plate"],0,"Book."],["Rutherford said an atom has a tiny central nucleus and a large:",["extra nuclear portion","inner core","outer shell of protons","solid crust"],0,"Book."],["Particles in the nucleus are held together by:",["strong nuclear force","weak nuclear force","electrostatic force","dipolar force"],0,"Book exercise MCQ."],["The nucleus contains more than what percentage of the mass of an atom?",["99.9%","50%","10%","1%"],0,"Book interesting information."],["The charge on an electron is:",["−1.6022 × 10⁻¹⁹ C","+1.6022 × 10⁻¹⁹ C","zero","−9.109 × 10⁻³¹ C"],0,"Book table."],["The mass of an electron is:",["9.109 × 10⁻³¹ kg","1.673 × 10⁻²⁷ kg","1.675 × 10⁻²⁷ kg","1.6022 × 10⁻¹⁹ kg"],0,"Book table."],["Bohr proposed his model for the hydrogen atom in:",["1913","1911","1897","1933"],0,"Book."],["According to Bohr, electrons revolve around the nucleus in specific paths called:",["orbits or shells","nuclei","clouds of protons","rays"],0,"Book."],["When the electron is in the orbit closest to the nucleus, the atom is in its:",["ground state","excited state","ionised state","radioactive state"],0,"Book."],["How do electrons stay away from the oppositely charged nucleus?",["By revolving around the nucleus","By staying still","Due to a ma "chem2.3":{"s":"Chemistry","label":"Ch 2.1: Shells, sub-shells and the 2n² rule","q":[["Orbits that are further from the nucleus have:",["greater energy","less energy","zero energy","the same energy"],0,"Book: energy increases away from the nucleus."],["The first shell is also called the:",["K shell","L shell","M shell","N shell"],0,"Book."],["The second shell is called the:",["L shell","K shell","M shell","s shell"],0,"Book."],["The maximum number of electrons in a shell is given by:",["2n²","n²","2n","n + 2"],0,"Book 2n² formula."],["The maximum number of electrons in the K shell is:",["2","8","18","32"],0,"2 × 1² = 2."],["The maximum number of electrons in the L shell is:",["8","2","18","6"],0,"2 × 2² = 8."],["How many electrons can the third shell hold at most?",["18","8","10","32"],0,"Book exercise MCQ: 2 × 3² = 18."],["The number of sub-shells in a shell equals:",["the value of n for that shell","2n²","always 2","always 4"],0,"Book."],["The second shell (n = 2) has sub-shells:",["s and p","s only","s, p and d","p and d"],0,"Book."],["The maximum electrons in s, p, d and f sub-shells are:",["2, 6, 10 and 14","2, 8, 18, 32","1, 3, 5, 7","2, 4, 6, 8"],0,"Book."],["The third shell (n = 3) has sub-shells:",["s, p and d","s and p","s only","s, p, d and f"],0,"Book."],["In the modern approach, the exact location of an electron:",["cannot be predicted with 100% certainty","is always fixed","is inside the nucleus","is the same as the proton"],0,"Book: electrons are like charged clouds."],["Why does energy of an electron increase from the first to second shell?",["The second shell is further from the nucleus","The second shell is closer","Electrons gain mass","Protons move outward"],0,"Book: orbits further away have greater energy."],["Atoms can be seen using a:",["transition electron microscope","magnifying glass","telescope","naked eye"],0,"Book interesting information."]]},
"chem2.4":{"s":"Chemistry","label":"Ch 2.2: Atomic number and mass number","q":[["The number of protons in an atom is its:",["atomic number","mass number","neutron number","valency"],0,"Book 2.2."],["Atomic number is represented by:",["Z","A","N","M"],0,"Book."],["Mass number is represented by:",["A","Z","N","P"],0,"Book."],["Mass number equals the number of:",["protons + neutrons","protons + electrons","neutrons only","electrons only"],0,"Book: nucleon number."],["The number of neutrons is found by:",["N = A − Z","N = Z − A","N = A + Z","N = A × Z"],0,"Book."],["In a neutral atom, the number of electrons equals the number of:",["protons","neutrons","nucleons","shells"],0,"Book."],["Elements in the periodic table are arranged in ascending order of:",["atomic number","mass number","neutron number","density"],0,"Book."],["Oxygen has 8 protons and mass number 16. How many neutrons does it have?",["8","16","24","6"],0,"16 − 8 = 8."],["Sulphur-32 (Z = 16) has how many neutrons?",["16","32","48","8"],0,"Book example: 32 − 16 = 16."],["Barium-137 (Z = 56) has how many neutrons?",["81","56","137","193"],0,"Book sample example."],["In the symbol of an element, the atomic number is written as a:",["left subscript","left superscript","right subscript","right superscript"],0,"Book."],["Why is the mass of electrons not included in the mass number?",["Electron mass is very small","Electrons have no charge","Electrons are in the nucleus","Electrons are counted twice"],0,"Book."],["Manganese-55 (Z = 25) has how many neutrons?",["30","25","55","80"],0,"55 − 25 = 30."],["Iodine-127 (Z = 53) has how many electrons in a neutral atom?",["53","127","74","180"],0,"Electrons = protons = 53."]]},
"chem2.5":{"s":"Chemistry","label":"Ch 2.3: Isotopes, radioactive isotopes and their uses","q":[["Atoms of the same element with different numbers of neutrons are called:",["isotopes","allotropes","ions","compounds"],0,"Book 2.3."],["Which particle is present in different numbers in isotopes?",["Neutron","Electron","Proton","Both neutron and electron"],0,"Book exercise MCQ."],["Hydrogen has three isotopes: hydrogen, deuterium and:",["tritium","ozone","helium","carbon"],0,"Book 2.3."],["Isotopes of an element have:",["the same chemical properties but different physical properties","different chemical properties","the same mass","different atomic numbers"],0,"Book: chemical properties depend on electrons."],["Deuterium (²H) has how many times the mass of ordinary hydrogen?",["Twice","Thrice","Same","Half"],0,"Book 2.3."],["Isotopes are not shown separately in the periodic table because:",["all isotopes have the same atomic number","they are unstable","there are too many","they show no periodic behaviour"],0,"Book exercise MCQ."],["Emission of radiation by unstable nuclei is called:",["radioactivity","ionisation","allotropy","sublimation"],0,"Book."],["Which isotope of hydrogen is radioactive?",["Tritium","Protium","Deuterium","All three"],0,"Book: tritium is radioactive."],["When a radioactive element emits radiation and changes into another element, it is called:",["radioactive decay","ionisation","condensation","allotropy"],0,"Book."],["Uranium-238 decays into:",["Thorium-234","Lead-206","Carbon-14","Radium-226"],0,"Book equation."],["Which radioactive isotope is used for diagnostic imaging of organs like brain and lungs?",["Technetium-99m","Carbon-12","Uranium-238","Hydrogen-1"],0,"Book applications."],["Radiocarbon dating uses the radioactive isotope:",["Carbon-14","Carbon-12","Carbon-13","Uranium-238"],0,"Book."],["Radiocarbon dating helps archaeologists to:",["determine the age of organic matter","find the composition of matter","make matter radioactive","measure density"],0,"Book exercise MCQ."],["When ionising radiation hits a sodium atom, the atom may lose an electron and become a:",["cation","anion","neutron","isotope"],0,"Book: Na → Na⁺ + e⁻."],["Radioactive isotopes are used in industry to:",["test the strength of metals and concrete","make plastic bags","colour fabrics","sweeten food"],0,"Book applications."]]},
"chem2.6":{"s":"Chemistry","label":"Ch 2.4: Relative atomic mass and calculation from isotopic abundance","q":[["On the relative atomic mass scale (1961), the standard is:",["carbon-12 taken as 12","hydrogen taken as 1","oxygen taken as 16","uranium-238"],0,"Book 2.4."],["One atomic mass unit (amu) is:",["one-twelfth the mass of a carbon-12 atom","the mass of one proton exactly","the mass of one electron","one-sixteenth the mass of oxygen"],0,"Book definition."],["1 amu is equal to:",["1.67377 × 10⁻²⁷ kg","9.109 × 10⁻³¹ kg","1.6022 × 10⁻¹⁹ kg","6.02 × 10²³ kg"],0,"Book."],["The mass numbers of isotopes of an element are called:",["relative isotopic masses","atomic numbers","valencies","abundances"],0,"Book."],["The naturally occurring percentage of each isotope is called its:",["isotopic abundance","isotopic mass","atomic number","valency"],0,"Book."],["Relative atomic mass from isotopes is calculated by:",["(m1p1 + m2p2 + ...) ÷ 100","(m1 + m2) ÷ 2","m1 × p1 only","p1 + p2 + ..."],0,"Book formula."],["Chlorine has Cl-35 (75%) and Cl-37 (25%). Its relative atomic mass is about:",["35.5","36","35","37"],0,"(35 × 75 + 37 × 25) ÷ 100 = 35.5."],["The relative atomic mass of krypton calculated in the book is:",["83.7","84","82","85"],0,"Book sample example 1."],["Rubidium-85 abundance is 72.2%. The abundance of rubidium-87 is:",["27.8%","15%","37%","72%"],0,"Book exercise: 100 − 72.2 = 27.8%."],["Nitrogen: ¹⁴N = 99.64%, ¹⁵N = 0.35%. Its relative atomic mass is about:",["14.0021","14.0210","14.2100","14.1200"],0,"Book exercise MCQ."],["The mass of one hydrogen-1 atom on the atomic mass scale is:",["1.007 amu","1.000 amu","2.014 amu","12 amu"],0,"Book."],["An element X has isotopes of mass 10 (20%) and 11 (80%). Its relative atomic mass is:",["10.8","10.5","10.2","11"],0,"(10 × 20 + 11 × 80) ÷ 100 = 10.8."],["Knowing relative atomic masses is needed to know:",["in which ratio of masses to mix reactants","the colour of compounds","the state of matter","the shape of molecule "chem3.1":{"s":"Chemistry","label":"Ch 3.1 to 3.2: Why atoms bond, duplet and octet rules, chemical bond","q":[["Atoms combine with other atoms to:",["decrease their energy and become more stable","increase their energy","lose all their electrons","become noble gases by nuclear change"],0,"Book 3.1."],["Helium has how many electrons in its outermost shell?",["2","8","1","18"],0,"Book 3.1."],["Noble gases other than helium have how many electrons in their outermost shell?",["8","2","6","18"],0,"Book 3.1."],["Having two electrons in the outermost shell (for H and He) is called the:",["duplet rule","octet rule","2n² rule","valency rule"],0,"Book 3.1."],["Having eight electrons in the outermost shell is called the:",["octet rule","duplet rule","triplet rule","noble rule"],0,"Book 3.1."],["Noble gases are unreactive because:",["their outer shells are complete, making them stable","they have no electrons","they are metals","they are radioactive"],0,"Book 3.1."],["For sodium it is easier to:",["lose one electron than gain seven","gain seven electrons","share eight electrons","keep its electron"],0,"Book 3.1."],["When hydrogen gains one electron, it forms a:",["hydride ion (H⁻)","proton (H⁺)","neutron","hydrogen molecule"],0,"Book 3.1: it completes its duplet."],["Alkali and alkaline earth metals are expected to be:",["electropositive","electronegative","noble","non-metals"],0,"Book 3.1."],["A chemical bond is a:",["force of attraction between atoms that holds them together","type of atom","mixture of elements","nuclear reaction"],0,"Book 3.2 definition."],["Two atoms react to form a molecule when:",["forces of attraction dominate forces of repulsion","forces of repulsion dominate","they have the same mass","they are both noble gases"],0,"Book 3.2."],["The arrangement of electrons in shells and sub-shells is called:",["electronic configuration","atomic number","valency","isotopy"],0,"Book important information."],["The three types of bonds discussed in Ch 3.2 are:",["ionic, "chem3.2":{"s":"Chemistry","label":"Ch 3.2.1: Ionic bond","q":[["An ionic bond is formed by:",["complete transfer of electrons from one atom to another","sharing of electron pairs","sharing a pair donated by one atom","a sea of electrons"],0,"Book 3.2.1."],["The electronic configuration of sodium (Z = 11) is:",["2, 8, 1","2, 8, 7","2, 9","2, 1, 8"],0,"Book Fig 3.1."],["The electronic configuration of chlorine (Z = 17) is:",["2, 8, 7","2, 8, 1","2, 7, 8","8, 8, 1"],0,"Book Fig 3.1."],["In forming NaCl, an electron moves from:",["sodium to chlorine","chlorine to sodium","both to the nucleus","neither atom"],0,"Book 3.2.1."],["Electrons that take part in a chemical reaction come only from the:",["outermost shells","nucleus","innermost shell","second shell always"],0,"Book 3.2.1."],["In NaCl, the oppositely charged ions are held by:",["electrostatic force of attraction","sharing of electrons","nuclear force","hydrogen bonding"],0,"Book 3.2.1."],["Another name for an ionic bond is:",["electrovalent bond","covalent bond","coordinate bond","metallic bond"],0,"Book 3.2.1."],["To form CaCl2, calcium loses:",["two electrons","one electron","three electrons","no electrons"],0,"Book 3.2.1."],["In ionic compounds, ions surround each other three-dimensionally to form a:",["crystal lattice","molecule","polymer chain","gas"],0,"Book 3.2.1."],["Which is an example of an ionic compound from the book?",["KCl","CH4","H2O","NH3"],0,"Book examples: KCl, MgF2, NaF, KBr, CaF2."],["Sodium reacts with fluorine to give:",["sodium fluoride","sodium chloride","fluorine oxide","sodium hydride"],0,"Book 3.2.1."],["Ionic bonds usually form between:",["metals and non-metals","two non-metals","two noble gases","two identical atoms"],0,"Electropositive metals bond with electronegative non-metals."],["After transferring an electron, sodium and chlorine acquire the configurations of their:",["nearest noble gases","neighbouring metals","isotopes","allotropes"],0,"Book 3.2.1."],["Calcium ion is represented as:",["Ca²⁺","Ca⁺","Ca²⁻","Ca"],0,"Ca loses two electrons."]]},
"chem3.3":{"s":"Chemistry","label":"Ch 3.2.2: Covalent bonds (single, double, triple) and covalent molecules","q":[["A covalent bond is formed by:",["mutual sharing of an electron pair between atoms","complete transfer of electrons","donation by one atom only","a sea of electrons"],0,"Book 3.2.2."],["A double covalent bond has how many shared electron pairs?",["Two","One","Three","Four"],0,"Book 3.2.2."],["A triple covalent bond is shown by:",["three lines (≡)","one line (−)","two lines (=)","an arrow (→)"],0,"Book 3.2.2."],["The nitrogen molecule (N2) has a:",["triple covalent bond","single bond","double bond","ionic bond"],0,"Book Fig 3.5."],["The chlorine molecule (Cl2) has a:",["single covalent bond","double bond","triple bond","ionic bond"],0,"Book Fig 3.5."],["In a water molecule, oxygen shares electrons with:",["two hydrogen atoms","one hydrogen atom","three hydrogen atoms","two oxygen atoms"],0,"Book: formation of water."],["In carbon dioxide (O=C=O), carbon forms:",["two double bonds","four single bonds","one triple bond","two single bonds"],0,"Book: carbon shares four electrons with two oxygens."],["In methane (CH4), carbon forms how many single bonds?",["Four","Two","Three","One"],0,"Book Fig 3.6."],["Hydrogen cyanide (HCN) contains a:",["triple bond between C and N","double bond between C and N","ionic bond","only single bonds"],0,"Book: H−C≡N."],["Which among the following has a double covalent bond?",["Ethylene","Ethane","Methane","Acetylene"],0,"Book exercise MCQ: ethene (ethylene) has C=C."],["After sharing electrons, bonded atoms acquire the configuration of the:",["nearest noble gas","nearest metal","heaviest element","hydrogen atom"],0,"Book."],["When two atoms approach to bond, the atoms settle at a distance where:",["total energy is minimum","repulsion is maximum","energy is maximum","no forces act"],0,"Book 3.2.2."],["Covalent bonds usually form between:",["non-metals","metals and non-metals","two metals","noble gases only"],0,"Covalent compoun "chem3.4":{"s":"Chemistry","label":"Ch 3.2.2 to 3.2.3: Polar and non-polar bonds, coordinate covalent bond","q":[["A covalent bond between two identical atoms is:",["non-polar","polar","ionic","coordinate"],0,"Book: e.g. H2 and Cl2."],["In HCl, the shared pair of electrons is pulled towards:",["chlorine","hydrogen","the middle exactly","neither"],0,"Chlorine is more electronegative."],["In a polar bond, the more electronegative atom gets a:",["partial negative charge","partial positive charge","full positive charge","no charge"],0,"Book."],["The covalent bonds in water are:",["polar","non-polar","ionic","metallic"],0,"Book."],["In a coordinate covalent bond, the shared electron pair is donated by:",["one atom only","both atoms equally","a metal sea","the nucleus"],0,"Book 3.2.3."],["The species that donates the electron pair is called the:",["donor","acceptor","catalyst","ion"],0,"Book 3.2.3."],["A coordinate covalent bond is shown by an arrow pointing towards the:",["acceptor","donor","nucleus","solvent"],0,"Book 3.2.3."],["When H⁺ joins a water molecule, it forms:",["hydroxonium ion (H3O⁺)","hydroxide ion","hydride ion","ozone"],0,"Book Fig 3.7."],["In the reaction of NH3 with BF3, the electron pair is donated by:",["nitrogen of ammonia","boron","fluorine","hydrogen"],0,"Book Fig 3.8."],["After H3O⁺ forms, its three O−H bonds:",["behave exactly alike","are all different","are all ionic","break easily"],0,"Book."],["When a coordinate covalent bond breaks, both bonded electrons go to the:",["donor species","acceptor species","nucleus","solvent"],0,"Book."],["Which compound contains both covalent and ionic bonds?",["NH4Cl","MgCl2","CaO","PCl3"],0,"Book exercise MCQ."],["Which element can form ionic, covalent and coordinate covalent bonds?",["Oxygen","Carbon","Magnesium","Silicon"],0,"Book exercise MCQ: e.g. oxides (ionic), H2O (covalent), H3O⁺ (coordinate)."],["The difference between a covalent and coordinate covalent bond lies in:",["the way they are formed","their "chem3.7":{"s":"Chemistry","label":"Ch 3.8: Nature of bonding and properties (ionic solids, diamond, graphite, covalent substances)","q":[["Ionic bonds are non-directional because ions are:",["spherical and can surround each other from all sides","shared between two atoms","arranged in chains","held by mobile electrons"],0,"Book 3.8."],["When an external force is applied, an ionic crystal:",["breaks easily (brittle)","bends like a metal","melts immediately","conducts electricity"],0,"Book 3.8."],["Solid ionic compounds do not conduct electricity because:",["ions are tightly held and cannot move","they have no ions","they are covalent","they contain free electrons"],0,"Book 3.8."],["When water surrounds and interacts with ions, the process is called:",["hydration","sublimation","ionisation by radiation","crystallisation"],0,"Book 3.8."],["Mixing NaCl and AgNO3 solutions gives a white precipitate of:",["silver chloride","sodium nitrate","silver nitrate","sodium chloride"],0,"Book 3.8."],["Electrolysis of molten sodium chloride gives:",["sodium metal and chlorine gas","sodium hydroxide and chlorine","hydrogen and oxygen","salt water"],0,"Book interesting information."],["The amorphous form of carbon is:",["coal","diamond","graphite","fullerene"],0,"Book 3.8."],["Diamond is the hardest substance because each carbon is:",["linked to four other carbons by strong covalent bonds","linked to three carbons in layers","part of a cage","held by weak forces"],0,"Book 3.8."],["Graphite is used as a lubricant because:",["its layers are not bonded strongly and slip past each other","it is very hard","it is a gas","it dissolves in oil"],0,"Book 3.8."],["Graphite conducts electricity because:",["mobile electrons are present between its layers","it is ionic","it is hard","it contains metal"],0,"Book 3.8."],["Diamond-tipped tools are used for:",["cutting glass and drilling hard rocks","lubricating machines","making pencils","electrodes"],0,"Book interesting information."],["Bromine (Br "chem4.1":{"s":"Chemistry","label":"Ch 4.1 to 4.2: Chemical formula and empirical formula","q":[["Elements that exist as aggregates of atoms (like Na, Ca, Fe) are represented by:",["their symbols alone","molecular formulas","empirical formulas","structural formulas"],0,"Book 4.1."],["The chemical formula of ozone is:",["O3","O2","O","O4"],0,"Book 4.1: three oxygen atoms bonded together."],["Sodium chloride is represented by a formula unit NaCl because the ratio of its ions is:",["1 : 1","1 : 2","2 : 1","1 : 3"],0,"Book 4.1."],["The formula that shows all types of atoms bonded in one molecule of a compound is the:",["molecular formula","empirical formula","formula unit","symbol"],0,"Book 4.1."],["The formula H2O shows that one water molecule has:",["two hydrogen atoms bonded to one oxygen atom","one hydrogen and two oxygen atoms","two molecules of hydrogen","one atom of each"],0,"Book 4.1."],["The empirical formula shows the:",["simplest whole number ratio of atoms in a compound","actual number of atoms in a molecule","arrangement of atoms","mass of one mole"],0,"Book 4.2."],["Ionic compounds are represented by their:",["empirical formulas","molecular formulas","structural formulas","symbols only"],0,"Book 4.2."],["The empirical formula of hydrogen peroxide (H2O2) is:",["HO","H2O","H2O2","OH2"],0,"Book 4.2."],["The empirical formula of benzene (C6H6) is:",["CH","C6H6","C2H2","CH2"],0,"Book 4.2."],["For water, the molecular and empirical formulas are:",["the same (H2O)","different","HO and H2O","H2 and O"],0,"Book 4.2."],["Which two compounds have the same empirical formula CH?",["Benzene and acetylene","Water and hydrogen peroxide","Methane and ethane","Glucose and water"],0,"Book 4.2."],["The empirical formula of glucose (C6H12O6) is:",["CH2O","C6H12O6","CHO","C2H4O2"],0,"Divide by 6."],["2-hexene has the formula C6H12. Its empirical formula is:",["CH2","CH","C6H12","C3H6"],0,"Book exercise MCQ: simplest ratio 1 : 2."],["Which is an example of a covalent compound gi "chem4.2":{"s":"Chemistry","label":"Ch 4.3: Formulas of binary ionic compounds (crisscross method)","q":[["To write the formula of an ionic compound, the final compound must be:",["electrically neutral","positively charged","negatively charged","a gas"],0,"Book 4.3."],["In the crisscross method, the numerical value of each ion's charge becomes:",["the subscript of the other ion","its own subscript","a coefficient","a superscript"],0,"Book 4.3."],["The formula of lithium oxide is:",["Li2O","LiO","LiO2","Li2O2"],0,"Book: Li⁺ and O²⁻."],["The formula of aluminium oxide is:",["Al2O3","AlO","Al3O2","AlO3"],0,"Book: Al³⁺ and O²⁻."],["The formula of magnesium nitride is:",["Mg3N2","MgN","Mg2N3","MgN2"],0,"Book: Mg²⁺ and N³⁻."],["The correct formula of calcium phosphide is:",["Ca3P2","CaP","Ca2P3","CaP2"],0,"Book exercise MCQ: Ca²⁺ and P³⁻."],["The charge on an aluminium ion is:",["3+","2+","1+","3−"],0,"Book table 4.1."],["The charge on an oxide ion is:",["2−","1−","3−","2+"],0,"Book table 4.1."],["The charge on a nitride ion is:",["3−","2−","1−","3+"],0,"Book table 4.1."],["Which metal can form two ions, Fe²⁺ and Fe³⁺?",["Iron","Sodium","Calcium","Zinc"],0,"Book table 4.1."],["The formula of barium nitride is:",["Ba3N2","BaN","Ba2N3","BaN3"],0,"Ba²⁺ and N³⁻."],["The formula of calcium chloride is:",["CaCl2","CaCl","Ca2Cl","CaCl3"],0,"Ca²⁺ and Cl⁻."],["The formula of sodium oxide is:",["Na2O","NaO","NaO2","Na2O2"],0,"Na⁺ and O²⁻."],["In table 4.1, copper can form the ions:",["Cu⁺ and Cu²⁺","Cu³⁺ only","Cu⁻","Cu²⁻"],0,"Book table 4.1."]]},

"chem4.5":{"s":"Chemistry","label":"Ch 4.6: Avogadro's number","q":[["Avogadro's number is:",["6.022 × 10²³","6.022 × 10⁻²³","1.67 × 10⁻²⁷","9.109 × 10⁻³¹"],0,"Book 4.6."],["Avogadro was:",["an Italian scientist","an English chemist","a Greek philosopher","a German physicist"],0,"Book 4.6."],["Avogadro's number is represented by:",["NA","Z","A","n"],0,"Book 4.6."],["1.00 g equals how many amu?",["6.022 × 10²³ amu","1 amu","10²³ amu","6.022 × 10⁻²³ amu"],0,"Book exercise MCQ and 4.6."],["In 2C + O2 → 2CO, 24 g of carbon reacts with:",["32 g of oxygen","16 g of oxygen","24 g of oxygen","56 g of oxygen"],0,"Book 4.6."],["In 2C + O2 → 2CO, the mass of CO produced from 24 g C is:",["56 g","28 g","32 g","44 g"],0,"Book 4.6."],["Increasing the number of reacting atoms in an equation:",["does not change the ratio in which they react","changes the ratio","stops the reaction","doubles the ratio"],0,"Book 4.6."],["Avogadro's number is the number of units in:",["one mole of a substance","one gram of any substance","one litre of gas","one atom"],0,"Book 4.6."],["A necklace has 6 g of diamond (carbon). The number of carbon atoms is:",["3.01 × 10²³","6.02 × 10²³","12.04 × 10²³","1.003 × 10²³"],0,"6 g = 0.5 mol × 6.02 × 10²³."],["12 g of carbon contains how many atoms?",["6.022 × 10²³","12 × 10²³","3.01 × 10²³","1"],0,"One mole of C atoms."],["32 g of oxygen gas contains how many O2 molecules?",["6.022 × 10²³","3.01 × 10²³","12.04 × 10²³","32"],0,"One mole of O2."],["Avogadro's number was needed so chemists could:",["express reacting masses in grams","see atoms","count protons","change atomic numbers"],0,"Book 4.6."],["The number of molecules in 9 g of water (18 g/mol) is:",["3.01 × 10²³","6.022 × 10²³","9 × 10²³","1.5 × 10²³"],0,"0.5 mol."],["How many atoms are in 2 moles of helium?",["12.044 × 10²³","6.022 × 10²³","2","4 × 10²³"],0,"2 × 6.022 × 10²³."]]},
"chem4.6":{"s":"Chemistry","label":"Ch 4.7: The mole and molar mass","q":[["The quantity of a substance containing Avogadro's number of particles is a:",["mole","gram","litre","dozen"],0,"Book 4.7."],["A mole is a number like a:",["dozen or a gross","metre","kilogram","litre"],0,"Book 4.7."],["A mole of carbon atoms weighs:",["12 g","6 g","24 g","1 g"],0,"Book 4.7."],["A mole of oxygen molecules (O2) weighs:",["32 g","16 g","8 g","64 g"],0,"Book 4.7."],["A mole of sodium chloride weighs:",["58.5 g","23 g","35.5 g","117 g"],0,"Book 4.7."],["The mass of one mole of a substance is its:",["molar mass","atomic number","mass number","density"],0,"Book 4.7."],["The molar mass of hydrogen molecules (H2) is:",["2.016 g","1.008 g","4.032 g","1 g"],0,"Book 4.7."],["The molar mass of H2SO4 is:",["98 g/mol","96 g/mol","49 g/mol","100 g/mol"],0,"Book: 2(1) + 32 + 4(16)."],["The molar mass of glucose (C6H12O6) is:",["180 g/mol","90 g/mol","120 g/mol","160 g/mol"],0,"Book sample."],["Moles = mass ÷ ?",["molar mass","Avogadro's number","volume","atomic number"],0,"Number of moles = mass ÷ molar mass."],["How many moles are in 25 g of H2SO4?",["0.255 moles","0.765 moles","0.51 moles","0.4 moles"],0,"Book exercise: 25 ÷ 98."],["How many moles are in 36 g of water?",["2","1","0.5","36"],0,"36 ÷ 18."],["The molar mass of CO2 is:",["44 g/mol","28 g/mol","32 g/mol","22 g/mol"],0,"12 + 32."],["The mole concept lets us count atoms by:",["weighing small amounts of matter","seeing them","using a ruler","heating them"],0,"Book interesting information."]]},

"eng4.1":{"s":"English","label":"Unit 4 part 1: Hazrat Asma (R.A.) (reading, glossary)","q":[["The Rasoolullah (PBUH) and Hazrat Abu Bakr Siddique (R.A.) migrated to Madinah in:",["622 A.D.","610 A.D.","632 A.D.","570 A.D."],0,"Unit 4, para 1."],["The preparation for the journey was made at the house of:",["Hazrat Abu Bakr Siddique (R.A.)","Hazrat Ali (R.A.)","Hazrat Umar (R.A.)","Abu Talib"],0,"Unit 4, para 2."],["Hazrat Asma tied the food on the camel's back with her:",["own belt","rope","scarf","bag"],0,"Unit 4, para 2."],["For this service, she was given the title:",["Zaat-un-Nitaqain","Siddiqa","Ummul Momineen","Saifullah"],0,"Unit 4."],["Every night Hazrat Asma took food to the cave of:",["Thawr","Hira","Uhud","Badr"],0,"Unit 4, para 3."],["When Abu Jehl asked, 'Where is your father?', she replied:",["'How would I know?'","'He is in Madinah'","'He is in the cave'","She stayed silent"],0,"Unit 4, para 4."],["Abu Jehl slapped her so hard that her:",["ear-ring fell off","bangle broke","scarf fell","tooth broke"],0,"Unit 4, para 4."],["Hazrat Asma's response to Abu Jehl showed her:",["self-discipline (wisdom and courage)","fear","anger","indifference"],0,"Unit 4 MCQ 2."],["Her grandfather, who was old and blind, was:",["Hazrat Abu Quhafa","Abu Talib","Abu Jehl","Abdullah bin Zubair"],0,"Unit 4, para 5."],["To comfort her grandfather, she covered ______ with a cloth.",["pebbles","gold coins","dates","books"],0,"Unit 4, para 5."],["Hazrat Asma was the wife of:",["Hazrat Zubair bin al-Awwam (R.A.)","Hazrat Usman (R.A.)","Hazrat Talha (R.A.)","Hazrat Khalid (R.A.)"],0,"Unit 4, para 6."],["Her son was:",["Hazrat Abdullah bin Zubair (R.A.)","Hazrat Hassan (R.A.)","Hazrat Abdullah bin Umar (R.A.)","Hazrat Anas (R.A.)"],0,"Unit 4, para 6."],["Hazrat Asma lived to about:",["a hundred years","sixty years","forty years","eighty years"],0,"Unit 4, para 6."],["Her generosity is shown by:",["selling her inherited garden and giving the money to the poor","preparing food","keeping a secret","comforting her grandfather"],0,"Unit 4 MCQ 5."],["'Perilous' means:",["dangerous","generous","extremely angry","strong and determined"],0,"Unit 4 glossary."],["'Resolute' means:",["strong and determined","a light","to cross an area","to discover"],0,"Unit 4 glossary."],["'Traverse' means:",["to cross an area of land or water","to make known","to make less severe","to provide a service"],0,"Unit 4 glossary."]]},
"isl1.1":{"s":"Islamiyat","label":"باب 1 (الف، ب): تدوینِ قرآن اور حفاظت و تدوینِ حدیث","q":[["لفظ قرآن کا معنی ہے:",["کثرت سے پڑھی جانے والی کتاب","صبح کے وقت پڑھی جانے والی کتاب","محفوظ کتاب","آخری کتاب"],0,"کتاب کا MCQ (i)۔"],["تمام مسلمانوں کو ایک قراءت اور لہجے پر متفق کرنے والی شخصیت ہیں:",["حضرت عثمان غنیؓ","حضرت عمر فاروقؓ","حضرت علیؓ","حضرت زید بن ثابتؓ"],0,"کتاب کا MCQ (ii)۔"],["قرآن مجید کے حفاظ کرام کثیر تعداد میں شہید ہوئے:",["جنگِ یمامہ میں","جنگِ یرموک میں","جنگِ قادسیہ میں","جنگِ جمل میں"],0,"کتاب کا MCQ (iii)۔"],["حضرت ابو بکر صدیقؓ کی طرف سے قرآن مجید کی جمع و تدوین کے لیے سربراہ مقرر کیے گئے:",["حضرت زید بن ثابتؓ","حضرت عبداللہ بن مسعودؓ","حضرت اسامہ بن زیدؓ","حضرت عبداللہ بن عمرؓ"],0,"کتاب کا MCQ (iv)۔"],["حضرت ابو بکرؓ کے دور میں جمع کیا گیا قرآن مجید کا نسخہ آخر میں کس کے پاس تھا؟",["حضرت حفصہؓ","حضرت عائشہؓ","حضرت ام سلمہؓ","حضرت ام حبیبہؓ"],0,"کتاب کا MCQ (v)۔"],["قرآن مجید کی جمع و تدوین کا مشورہ حضرت ابو بکرؓ کو کس نے دیا؟",["حضرت عمر فاروقؓ","حضرت علیؓ","حضرت عثمانؓ","حضرت زیدؓ"],0,"سبق کا متن۔"],["''بے شک ہم ہی نے اس ذکر کو نازل فرمایا اور بے شک ہم ہی اس کی حفاظت فرمانے والے ہیں'' کس سورت کی آیت ہے؟",["سورۃ الحجر: 9","سورۃ الحشر: 7","سورۃ محمد: 33","سورۃ البقرۃ: 2"],0,"سبق کا متن۔"],["عہدِ رسالت میں قرآن مجید عموماً کن چیزوں پر لکھا جاتا تھا؟",["پتھر کی سلوں، چمڑے، کھجور کی چھال اور اونٹ کے شانے کی ہڈیوں پر","کاغذ پر","کپڑے پر","لکڑی کی تختیوں پر صرف"],0,"سبق کا متن۔"],["نبی کریم ﷺ کے عمل کو کہا جاتا ہے:",["حدیثِ فعلی","حدیثِ قولی","حدیثِ تقریری","حدیثِ قدسی"],0,"کتاب کا MCQ (i)۔"],["حدیث کو جمع کرنا اور کتابی شکل دینا کہلاتا ہے:",["تدوینِ حدیث","فضیلتِ حدیث","روایتِ حدیث","درایتِ حدیث"],0,"کتاب کا MCQ (ii)۔"],["نبی کریم ﷺ نے حضرت عمرو بن حزمؓ کو کہاں کا والی بنا کر بھیجا؟",["یمن","مصر","شام","حبشہ"],0,"کتاب کا MCQ (iii)۔"],["صحاحِ ستہ میں شامل ہیں:",["چھے کتابیں","دو کتابیں","چار کتابیں","آٹھ کتابیں"],0,"کتاب کا MCQ (iv)۔"],["حضرت عمر بن عبدالعزیزؒ نے سرکاری سطح پر انتظام فرمایا:",["احادیث کی جمع و تدوین کا","احادیث پر عمل کرنے کا","احادیث کی شرح کا","احادیث کو حفظ کرنے کا"],0,"کتاب کا MCQ (v)۔"],["جس حدیث میں مفہوم اللہ تعالیٰ کی طرف سے اور الفاظ نبی کریم ﷺ کے ہوں:",["حدیثِ قدسی","حدیثِ فعلی","حدیثِ تقریری","حدیثِ قولی"],0,"سبق کا متن۔"],["صحابیؓ کے عمل پر نبی کریم ﷺ کی خاموشی کو کہتے ہیں:",["حدیثِ تقریری","حدیثِ قولی","حدیثِ قدسی","حدیثِ فعلی"],0,"سبق کا متن۔"],["''صحیفۂ صادقہ'' کس صحابی کا مرتب کردہ تھا؟",["حضرت عبداللہ بن عمرو بن عاصؓ","حضرت ابو ہریرہؓ","حضرت انسؓ","حضرت علیؓ"],0,"سبق کا متن۔"],["عہدِ رسالت میں صحابہ کرامؓ نے احادیث کو کتنے بڑے ذرائع سے محفوظ کیا؟",["تین: حفظ، کتابت اور عمل","دو","پانچ","ایک"],0,"سبق کا متن۔"],["جمع و تدوینِ حدیث کی تحریک کو اوج کمال تک پہنچانے کا اعزاز کسے حاصل ہے؟",["امام مالکؒ اور صحاحِ ستہ کے مؤلفین","حضرت عمر بن عبدالعزیزؒ اکیلے","حضرت زید بن ثابتؓ","حضرت حفصہؓ"],0,"سبق کا متن۔"]],"rtl":true},
"isl1.2":{"s":"Islamiyat","label":"باب 1 (ج): احادیثِ نبویہ اور الاسماء الحسنیٰ","q":[["حدیث کے لفظی معنی ہیں:",["بات اور گفتگو","عمل","خاموشی","کتاب"],0,"سبق کا متن۔"],["''مومنوں میں سے کامل ترین ایمان والا وہ ہے جو ...''",["اپنے اخلاق میں بہترین ہے","سب سے امیر ہے","سب سے زیادہ بولتا ہے","سب سے طاقت ور ہے"],0,"حدیث 1۔"],["''جو ہمارے چھوٹوں پر رحم نہیں کرتا اور بڑوں کا حق نہیں پہچانتا ...''",["وہ ہم میں سے نہیں","وہ کامیاب ہے","وہ امیر ہے","وہ عالم ہے"],0,"حدیث 2۔"],["جو چاہتا ہے کہ اس کے رزق میں وسعت ہو اور عمر لمبی ہو، اسے چاہیے کہ:",["صلہ رحمی کرے","زیادہ سوئے","تجارت چھوڑ دے","خاموش رہے"],0,"حدیث 4۔"],["حدیث کے مطابق کبیرہ گناہ کون سے ہیں؟",["اللہ کے ساتھ شرک، والدین کی نافرمانی، قتل اور جھوٹ بولنا","صرف چوری","صرف غیبت","صرف سستی"],0,"حدیث 5۔"],["''حیا سے ہمیشہ ______ پیدا ہوتی ہے۔''",["بھلائی","کمزوری","شرمندگی","دوری"],0,"حدیث 8۔"],["ہر مسلمان پر دوسرے مسلمان کی کیا چیزیں حرام ہیں؟",["خون، مال اور عزت","صرف مال","صرف گھر","صرف کھانا"],0,"حدیث 10۔"],["طاعون کے بارے میں نبی کریم ﷺ کا حکم:",["جہاں ہو وہاں سے نہ نکلو اور جہاں پھیلا ہو وہاں نہ جاؤ","فوراً بھاگ جاؤ","وہاں ضرور جاؤ","کوئی احتیاط نہیں"],0,"حدیث 11۔"],["جو مسلمان پودا لگائے یا کھیتی بوئے اور اس سے پرندہ، انسان یا جانور کھائے تو:",["وہ اس کی طرف سے صدقہ ہے","وہ گناہ ہے","اس کا کوئی اجر نہیں","وہ قرض ہے"],0,"حدیث 13۔"],["جو اللہ اور آخرت پر ایمان رکھتا ہو وہ اچھی بات کہے یا:",["خاموش رہے","زور سے بولے","بحث کرے","چلا جائے"],0,"حدیث 14۔"],["''بدگمانی سے دور رہو کیوں کہ بدگمانی ...''",["سب سے جھوٹی بات ہے","کبھی کبھی ٹھیک ہے","عقل مندی ہے","چھوٹا گناہ ہے"],0,"حدیث 18۔"],["حدیث کے مطابق اللہ کی لعنت کس پر ہے؟",["رشوت دینے والے اور رشوت لینے والے پر","مسافر پر","تاجر پر","کسان پر"],0,"حدیث 19۔"],["اللہ تعالیٰ اس کتاب (قرآن مجید) کے ذریعے:",["بہت سے لوگوں کو اونچا کرتا ہے اور بہتوں کو نیچے گراتا ہے","صرف عربوں کو عزت دیتا ہے","کسی کو نہیں بدلتا","صرف علما کو اونچا کرتا ہے"],0,"حدیث 20۔"],["''اَلْقَیُّوْمُ'' کا معنی:",["سب کو اپنی تدبیر سے قائم رکھنے والا","ہمیشہ زندہ رہنے والا","یکتا","بدلہ لینے والا"],0,"الاسماء الحسنیٰ 2۔"],["''اَلصَّمَدُ'' کا معنی:",["بے نیاز، سب کا مرکزِ نیاز","قدرت والا","معاف کرنے والا","نور"],0,"الاسماء الحسنیٰ 6۔"],["''اَلتَّوَّابُ'' کا معنی:",["زیادہ توبہ قبول کرنے والا","بدلہ لینے والا","روکنے والا","جمع کرنے والا"],0,"الاسماء الحسنیٰ 18۔"],["''اَلصَّبُوْرُ'' کا معنی:",["بہت زیادہ مہلت دینے والا","بہت سننے والا","سب کچھ دیکھنے والا","ہدایت دینے والا"],0,"الاسماء الحسنیٰ 37۔"],["''اَلْبَدِیْعُ'' کا معنی:",["بے مثال موجد، عدم سے وجود میں لانے والا","ہمیشہ رہنے والا","وارث و مالک","نقصان کا مالک"],0,"الاسماء الحسنیٰ 33۔"]],"rtl":true},

"maths2.2":{"s":"Maths","label":"Ch 2.2: Logarithm, logarithmic and exponential forms","q":[["The word logarithm comes from Greek words meaning:",["ratio or proportion","number and power","base and index","growth and decay"],0,"Book 2.2: logos and arithmos."],["The word logarithm was introduced by:",["John Napier","Henry Briggs","Euler","al-Khwarizmi"],0,"Book 2.2."],["John Napier was a:",["Scottish mathematician","Swiss mathematician","English mathematician","Greek philosopher"],0,"Book 2.2."],["log_b x = y means:",["bʸ = x","xʸ = b","yᵇ = x","bˣ = y"],0,"Book 2.2.1."],["log₂ 8 = 3 in exponential form is:",["2³ = 8","3² = 8","8³ = 2","2⁸ = 3"],0,"Book example 5."],["3⁴ = 81 in logarithmic form is:",["log₃ 81 = 4","log₄ 81 = 3","log₃ 4 = 81","log₈₁ 3 = 4"],0,"Book example 8 and review MCQ."],["7⁰ = 1 in logarithmic form is:",["log₇ 1 = 0","log₁ 7 = 0","log₀ 7 = 1","log₇ 0 = 1"],0,"Book example 8."],["If log₅ 25 = x, then x is:",["2","5","25","1/2"],0,"Book example 7."],["If log₂ x = 6, then x is:",["64","12","36","8"],0,"Book example 7."],["In log_b x, the base b must satisfy:",["b > 0 and b ≠ 1","b < 0","b = 1","b = 0"],0,"Book 2.2.1."],["log₄ 64 equals:",["3","4","16","2"],0,"4³ = 64."],["log₂ 1024 equals:",["10","12","9","512"],0,"2¹⁰ = 1024."],["The value of x in log_x 8 = 1 is:",["8","1","0","2"],0,"x¹ = 8."],["log₅ 1 equals:",["0","1","5","undefined"],0,"5⁰ = 1."],["log₄ 2 equals:",["1/2","2","4","1"],0,"4^(1/2) = 2."]]},
"maths2.3":{"s":"Maths","label":"Ch 2.3.1 to 2.3.2: Common logarithm, characteristic and mantissa","q":[["The base of the common logarithm is:",["10","2","e","5"],0,"Book 2.3."],["log 100 equals:",["2","3","10","1"],0,"10² = 100."],["log 0.01 equals:",["−2","2","−1","0.01"],0,"10⁻² = 0.01."],["The common logarithm and log table were developed by:",["Henry Briggs","John Napier","Euler","Newton"],0,"Book box."],["The integral part of a logarithm is called the:",["characteristic","mantissa","antilog","index"],0,"Book 2.3.1."],["The decimal part of a logarithm is called the:",["mantissa","characteristic","base","coefficient"],0,"Book 2.3.1."],["The mantissa is always:",["positive","negative","zero","an integer"],0,"Book 2.3.1."],["The characteristic of log 567 is:",["2","3","1","0"],0,"3 digits − 1."],["The characteristic of log 0.0123 is:",["−2 (2̄)","−1","2","1"],0,"−(1 + 1)."],["The characteristic of log 0.00045 is:",["−4","−3","3","4"],0,"Book example 9."],["The characteristic of log 9.87 is:",["0","1","9","−1"],0,"Book example 9."],["log 13.45 from tables is:",["1.1287","0.1287","2.1287","1.1271"],0,"Book worked example."],["log 345 is:",["2.5378","3.5378","1.5378","0.5378"],0,"Book example 10."],["If log 2 = 0.3010, then log 200 is:",["2.3010","1.3010","0.6010","2.6010"],0,"Book review MCQ."],["log 10,000 equals:",["4","3","2","10"],0,"Book review MCQ."],["The characteristic of log 145000 is:",["5","6","4","3"],0,"6 digits − 1."]]},

"maths2.5":{"s":"Maths","label":"Ch 2.4: Laws of logarithm and applications","q":[["The product law of logarithms is:",["log_b(xy) = log_b x + log_b y","log_b(xy) = log_b x × log_b y","log_b(x + y) = log_b x + log_b y","log_b(xy) = y log_b x"],0,"Book 2.4."],["The quotient law is:",["log_b(x/y) = log_b x − log_b y","log_b(x/y) = log_b x ÷ log_b y","log_b(x − y) = log_b x − log_b y","log_b(x/y) = y log_b x"],0,"Book 2.4."],["The power law is:",["log_b xⁿ = n log_b x","log_b xⁿ = (log_b x)ⁿ","log_b xⁿ = log_b n + log_b x","log_b xⁿ = x log_b n"],0,"Book 2.4."],["The change of base law is:",["log_b x = log_a x ÷ log_a b","log_b x = log_a b ÷ log_a x","log_b x = log_a x × log_a b","log_b x = log_x b"],0,"Book 2.4."],["log 5 + log 3 equals:",["log 15","log 8","log 2","log 5/3"],0,"Book review MCQ: product law."],["log₂ 18 − log₂ 9 equals:",["1","2","9","log₂ 9"],0,"log₂ 2 = 1."],["2 log 2 + log 25 equals:",["2","1","log 29","3"],0,"log 4 + log 25 = log 100."],["log₂ 20 expands to:",["2 log₂ 2 + log₂ 5","log₂ 2 + log₂ 10 × 2","4 log₂ 5","20 log₂ 2"],0,"Book example 12."],["2 log₂ 10 − log₂ 4 written as a single log is:",["log₂ 25","log₂ 16","log₂ 6","log₂ 5"],0,"Book example 14."],["log₃₂ 27 using change of base gives:",["(3/5) log₂ 3","(5/3) log₂ 3","log₂ 27/32","3 log 32"],0,"Book example 14."],["If log 2 + log x = 1, then x is:",["5","8","2","10"],0,"log 2x = 1 ⇒ 2x = 10."],["If log₂ x + log₂ 8 = 5, then x is:",["4","2","8","32"],0,"log₂ 8x = 5 ⇒ 8x = 32."],["Sound intensity 10⁶ times the reference with L = 40 log(I/I₀) gives L =",["240 decibels","60 decibels","40 decibels","400 decibels"],0,"Book example 15."],["Earthquake magnitude M = log(A/A₀) with A = 10,000 and A₀ = 10 is:",["3","4","1000","2"],0,"log 1000 = 3."],["log (x y z⁶) expands to:",["log x + log y + 6 log z","6 log xyz","log x · log y · log z⁶","log x + log y + log 6z"],0,"Book review Q8."],["log₃ 81 equals:",["4","3","27","9"],0,"3⁴ = 81."]]},

"maths3.2":{"s":"Maths","label":"Ch 3.1.1: Subsets, universal set and power set","q":[["If every element of A is in B, then:",["A is a subset of B","B is a subset of A","A and B are disjoint","A = B always"],0,"Book."],["If A ⊆ B, then B is called a:",["superset of A","subset of A","power set","complement"],0,"Book."],["A is a proper subset of B if A ⊆ B and B has:",["at least one element not in A","exactly the same elements","no elements","only one element"],0,"Book."],["Every set is an improper subset of:",["itself","the empty set","its complement","every other set"],0,"Book."],["The set containing all elements under consideration is the:",["universal set","power set","empty set","singleton set"],0,"Book: denoted by U."],["The power set of S is the set of:",["all possible subsets of S","all elements of S","only proper subsets","only singletons"],0,"Book."],["If S has n elements, P(S) has:",["2ⁿ elements","n² elements","2n elements","n elements"],0,"Book."],["The number of elements in the power set of {a, b, c} is:",["8","6","3","9"],0,"2³ = 8."],["If A = { }, then P(A) is:",["{ { } }","{ }","{1}","0"],0,"Book review MCQ: the only subset is the empty set itself."],["How many subsets does {1, 2} have?",["4","2","3","1"],0,"{ }, {1}, {2}, {1, 2}."],["The empty set is a subset of:",["every set","no set","only itself","only finite sets"],0,"Standard result."],["Which set has no proper subset?",["The empty set","{0}","{1, 2}","N"],0,"Book exercise 3.1 Q4."],["N ⊆ Z ⊆ Q ⊆ R shows:",["each set is a subset of the next","the sets are disjoint","the sets are equal","Z is not in Q"],0,"Number sets."],["The number of elements of P({1, 2, 3, 4}) is:",["16","8","4","12"],0,"2⁴."]]},
"maths3.3":{"s":"Maths","label":"Ch 3.2: Operations on sets and Venn diagrams","q":[["A ∪ B is the set of elements that belong to:",["A or B","both A and B","A but not B","neither A nor B"],0,"Book 3.2."],["A ∩ B is the set of elements that belong to:",["both A and B","A or B","only A","only B"],0,"Book 3.2."],["If A = {1, 2, 3} and B = {2, 3, 4, 5}, then A ∪ B is:",["{1, 2, 3, 4, 5}","{2, 3}","{1}","{4, 5}"],0,"Book example."],["For the same sets, A ∩ B is:",["{2, 3}","{1, 2, 3, 4, 5}","{1, 4, 5}","{ }"],0,"Book example."],["If A ∩ B is the empty set, A and B are:",["disjoint sets","overlapping sets","equal sets","subsets"],0,"Book."],["The set of odd and the set of even natural numbers are:",["disjoint","overlapping","equal","subsets of each other"],0,"Book example."],["Sets whose intersection is non-empty and neither is a subset of the other are:",["overlapping sets","disjoint sets","equal sets","power sets"],0,"Book."],["A − B contains elements that:",["belong to A but not to B","belong to both","belong to B but not A","belong to neither"],0,"Book."],["If A = {1, 2, 3, 4, 5} and B = {4, 5, 6, 7}, then A − B is:",["{1, 2, 3}","{6, 7}","{4, 5}","{1, 2, 3, 6, 7}"],0,"Book example."],["For any set A, its complement A′ equals:",["U − A","A − U","A ∪ U","A ∩ U"],0,"Book remark."],["If U = Z, the complement of the set of even integers is:",["the set of odd integers","the empty set","Z","{0}"],0,"Book: E′ = O."],["Venn diagrams were first used by the English logician:",["John Venn","Georg Cantor","De Morgan","Euler"],0,"Book 3.2.1."],["If U = {1, 2, 3, 4, 5}, A = {1, 2, 3}, B = {3, 4, 5}, then U − (A ∩ B) is:",["{1, 2, 4, 5}","{2, 3}","{1, 3, 4, 5}","{1, 2, 3}"],0,"Book review MCQ."],["In general, A − B and B − A are:",["not equal","always equal","both empty","both equal to U"],0,"Book: A − B ≠ B − A."]]},
"maths3.4":{"s":"Maths","label":"Ch 3.2.2: Operations on three sets, laws, De Morgan's laws, inclusion-exclusion","q":[["A ∪ B = B ∪ A is the:",["commutative property of union","associative property","distributive property","De Morgan's law"],0,"Book 3.2.2.1."],["A ∪ (B ∪ C) = (A ∪ B) ∪ C is the:",["associative property of union","commutative property","distributive property","identity"],0,"Book."],["A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C) is:",["distributivity of intersection over union","distributivity of union over intersection","associativity","De Morgan's law"],0,"Book."],["De Morgan's law: (A ∪ B)′ equals:",["A′ ∩ B′","A′ ∪ B′","A ∩ B","(A ∩ B)′"],0,"Book."],["De Morgan's law: (A ∩ B)′ equals:",["A′ ∪ B′","A′ ∩ B′","A ∪ B","U"],0,"Book."],["The cardinality n(A) of a set means:",["the number of elements in A","the largest element","the power set","the complement"],0,"Book 3.2.2 applications."],["If A = {1, 3, 5, 7, 9, 11}, n(A) is:",["6","11","5","36"],0,"Book example."],["n(A ∪ B) equals:",["n(A) + n(B) − n(A ∩ B)","n(A) + n(B)","n(A) × n(B)","n(A) − n(B)"],0,"Inclusion-exclusion for two sets."],["If n(A ∪ B) = 50, n(A) = 30 and n(B) = 35, then n(A ∩ B) is:",["15","23","9","40"],0,"Book review MCQ: 30 + 35 − 50."],["For overlapping sets, n(A − B) equals:",["n(A) − n(A ∩ B)","n(A)","n(B)","n(A ∩ B)"],0,"Book review MCQ."],["If A ⊆ B, then n(B − A) equals:",["n(B) − n(A)","0","n(A)","n(B)"],0,"Book review MCQ."],["180 students: 120 passed maths, 90 passed science, 60 passed both. How many passed either?",["150","210","120","90"],0,"Book review Q15: 120 + 90 − 60."],["In the same question, how many failed both tests?",["30","60","0","90"],0,"180 − 150."],["In the same question, how many passed science but not maths?",["30","60","90","120"],0,"90 − 60."]]},
"maths3.5":{"s":"Maths","label":"Ch 3.3 to 3.3.1: Cartesian product, binary relations, domain and range","q":[["Mathematically, a relation is any set of:",["ordered pairs","numbers","sets of letters","equations"],0,"Book 3.3."],["The set of all ordered pairs (a, b) with a ∈ A and b ∈ B is the:",["Cartesian product A × B","union A ∪ B","intersection","power set"],0,"Book 3.3."],["Any subset of A × B is called a:",["binary relation from A to B","function always","power set","universal set"],0,"Book 3.3."],["The set of first elements of a relation's ordered pairs is its:",["domain","range","co-domain","image"],0,"Book 3.3."],["The set of second elements of a relation's ordered pairs is its:",["range","domain","index","base"],0,"Book 3.3."],["If A = {1, 2, 3, 4} and B = {x, y, z}, A × B has how many elements?",["12","7","13","6"],0,"Book review MCQ: 4 × 3."],["For A = {1, 2, 3} and r: x < y, the relation is:",["{(1, 2), (1, 3), (2, 3)}","{(2, 1), (3, 1), (3, 2)}","{(1, 1), (2, 2), (3, 3)}","{(1, 3)}"],0,"Book example 8."],["In example 8, Dom r is:",["{1, 2}","{2, 3}","{1, 2, 3}","{3}"],0,"Book example 8."],["In example 8, Range r is:",["{2, 3}","{1, 2}","{1, 3}","{1, 2, 3}"],0,"Book example 8."],["The x-coordinate of an ordered pair is called the:",["abscissa","ordinate","range","domain"],0,"Book 3.3.1."],["The y-coordinate is called the:",["ordinate","abscissa","index","radicand"],0,"Book 3.3.1."],["A relation can be represented as:",["a table, ordered pairs or a graph","only a graph","only a table","only words"],0,"Book 3.3.1."],["Any subset of A × A is called a relation:",["in A","from B","onto A","into B"],0,"Book 3.3 (v)."],["(2, 3) and (3, 2) are:",["different ordered pairs","the same ordered pair","not ordered pairs","sets"],0,"Order matters in ordered pairs."]]},
"maths3.6":{"s":"Maths","label":"Ch 3.3.2 to 3.3.4: Functions, types of functions, linear and quadratic functions","q":[["A relation f from A to B is a function if Dom f = A and:",["no two pairs have the same first element","no two pairs have the same second element","range equals A","it has only one pair"],0,"Book 3.3.2."],["In y = f(x), y is called the:",["image of x under f","domain","pre-image","index"],0,"Book 3.3.2."],["If Range f ≠ B (range is a proper subset of B), f is an:",["into function","onto function","bijective function","inverse"],0,"Book types of functions."],["A function where no two pairs have the same second element is:",["one-one (injective)","onto","into only","constant"],0,"Book."],["A function with Range f = B is:",["onto (surjective)","into","injective only","not a function"],0,"Book."],["A function that is both one-one and onto is:",["bijective","into","constant","surjective only"],0,"Book."],["A bijective function is also called a:",["one-to-one correspondence","relation in A","power set","Cartesian product"],0,"Book."],["{(x, y) | y = mx + c} is a:",["linear function","quadratic function","cubic function","constant set"],0,"Book 3.3.4."],["{(x, y) | y = ax² + bx + c} is a:",["quadratic function","linear function","cubic function","logarithmic function"],0,"Book 3.3.4."],["If f(x) = 2x − 1, then f(−3) is:",["−7","−5","7","5"],0,"Book example 10."],["If g(x) = x² − 3, then g(4) is:",["13","5","16","1"],0,"Book example 10."],["Given f(x) = 3x + 1 and f(x) = 28, x is:",["9","27","3","18"],0,"Book review MCQ."],["If A = {1, 2, 3}, B = {a, b} and f = {(1, a), (2, b), (3, b)}, f is:",["surjective","injective","bijective","into only"],0,"Book review MCQ: every element of B is an image."],["If f(x) = x² − 3x + 2, then f(a + 1) equals:",["a² − a","a² + 1","a² + 2a + 1","a + 1"],0,"Book review MCQ: (a+1)² − 3(a+1) + 2."]]},
"maths4.1":{"s":"Maths","label":"Ch 4.1.1 to 4.1.2: Common factors and trinomial factoring (concretely and pictorially)","q":[["A common factor is an expression that:",["divides each term exactly","is added to each term","is the largest term","is always 1"],0,"Book 4.1.1."],["The common factor of x² + 2x is:",["x","2","x + 2","2x"],0,"x(x + 2)."],["The common factor of 6x + 9 is:",["3","6","9","x"],0,"3(2x + 3)."],["Factorise 5a² − 10a:",["5a(a − 2)","5(a² − 2)","a(5a − 10)","5a(a + 2)"],0,"Take 5a common."],["Trinomial factoring converts a trinomial into:",["a product of two binomials","a single monomial","a sum of squares","a cube"],0,"Book 4.1.2."],["x² − 5x + 4 factorises to:",["(x − 1)(x − 4)","(x + 1)(x + 4)","(x − 2)(x − 2)","(x − 5)(x + 1)"],0,"Book example 2."],["x² − 3x − 10 factorises to:",["(x − 5)(x + 2)","(x + 5)(x − 2)","(x − 10)(x + 1)","(x − 2)(x − 5)"],0,"Book example 3."],["In algebra tiles, a trinomial is factorised by arranging the tiles into a:",["rectangle","circle","triangle","line"],0,"Book 4.1.1: lengths of sides give the factors."],["Factorise 3xy + 6y:",["3y(x + 2)","3(xy + 2)","y(3x + 6y)","6y(x + 1)"],0,"Take 3y common."],["Factorise x² + 7x + 12:",["(x + 3)(x + 4)","(x + 2)(x + 6)","(x + 1)(x + 12)","(x − 3)(x − 4)"],0,"3 × 4 = 12, 3 + 4 = 7."],["Factorise a² − 9:",["(a − 3)(a + 3)","(a − 3)²","(a + 9)(a − 1)","(a − 9)(a + 1)"],0,"Difference of squares."],["Factorise 4x² − 8x:",["4x(x − 2)","4(x² − 2)","x(4x − 8x)","2x(2x + 4)"],0,"Take 4x common."],["In x² + bx + c, the two numbers chosen must multiply to give:",["c","b","b + c","1"],0,"Product = constant term."],["…and add to give:",["b","c","bc","0"],0,"Sum = middle coefficient."]]},
"maths4.2":{"s":"Maths","label":"Ch 4.1.3 Type I: x² + px + q and ax² + bx + c","q":[["x² + 9x + 14 factorises to:",["(x + 2)(x + 7)","(x + 1)(x + 14)","(x + 3)(x + 6)","(x − 2)(x − 7)"],0,"Book example 4."],["x² − 11x + 24 factorises to:",["(x − 3)(x − 8)","(x + 3)(x + 8)","(x − 4)(x − 6)","(x − 2)(x − 12)"],0,"Book example 5."],["p² + 11p + 18 factorises to:",["(p + 2)(p + 9)","(p + 3)(p + 6)","(p + 1)(p + 18)","(p − 2)(p − 9)"],0,"Book example 6."],["For 2x² + 17x + 26, we list factors of:",["52","26","17","2"],0,"Book example 7: a × c = 2 × 26."],["2x² + 17x + 26 factorises to:",["(x + 2)(2x + 13)","(2x + 2)(x + 13)","(x + 13)(2x + 1)","(2x + 26)(x + 1)"],0,"Book example 7: 4 + 13 = 17."],["3x² − 4x − 4 factorises to:",["(x − 2)(3x + 2)","(x + 2)(3x − 2)","(3x − 4)(x + 1)","(x − 4)(3x + 1)"],0,"Book example 8."],["An expression of degree 2 is called a:",["quadratic expression","cubic expression","linear expression","constant"],0,"Book box."],["x² + x − 12 factorises to:",["(x + 4)(x − 3)","(x − 4)(x + 3)","(x + 6)(x − 2)","(x + 12)(x − 1)"],0,"4 × −3 = −12, 4 − 3 = 1."],["2x² + 7x + 3 factorises to:",["(2x + 1)(x + 3)","(2x + 3)(x + 1)","(x + 7)(2x + 3)","(2x − 1)(x − 3)"],0,"ac = 6: 1 and 6."],["x² − 2x − 15 factorises to:",["(x − 5)(x + 3)","(x + 5)(x − 3)","(x − 15)(x + 1)","(x − 3)(x − 5)"],0,"−5 × 3 = −15."],["6x² + x − 2 factorises to:",["(2x − 1)(3x + 2)","(2x + 1)(3x − 2)","(6x − 2)(x + 1)","(3x − 1)(2x + 2)"],0,"ac = −12: 4 and −3."],["x² − 10x + 25 factorises to:",["(x − 5)²","(x + 5)²","(x − 5)(x + 5)","(x − 25)(x − 1)"],0,"Perfect square."],["The middle-term split method for ax² + bx + c uses factors of:",["a × c","b × c","a + c","a × b"],0,"Book step II."],["5x² + 13x + 6 factorises to:",["(5x + 3)(x + 2)","(5x + 2)(x + 3)","(5x + 6)(x + 1)","(x + 6)(5x + 1)"],0,"ac = 30: 10 and 3."]]},
"maths4.3":{"s":"Maths","label":"Ch 4.1.3 Types II and III: a⁴ + a²b² + b⁴, a⁴ + 4b⁴ and products of four factors","q":[["x⁴ + x² + 1 is factorised by first:",["adding and subtracting x² to make a perfect square","taking x common","dividing by x","using the cube identity"],0,"Type II method."],["x⁴ + x² + 1 factorises to:",["(x² + x + 1)(x² − x + 1)","(x² + 1)²","(x² + 1)(x² − 1)","(x + 1)⁴"],0,"(x² + 1)² − x²."],["a⁴ + 64 is written as a perfect square by adding and subtracting:",["16a²","8a²","4a²","64a²"],0,"(a² + 8)² − 16a²."],["a⁴ + 64 factorises to:",["(a² + 4a + 8)(a² − 4a + 8)","(a² + 8)²","(a + 4)⁴","(a² − 8)(a² + 8)"],0,"Book example 11."],["x⁴ + 4 factorises to:",["(x² + 2x + 2)(x² − 2x + 2)","(x² + 2)²","(x + 2)(x³ + 2)","(x² − 2)(x² + 2)"],0,"(x² + 2)² − 4x²."],["The final step in Type II uses the identity:",["a² − b² = (a − b)(a + b)","a³ + b³","(a + b)²","a² + b²"],0,"Difference of squares."],["For (x + 2)(x + 3)(x + 4)(x + 5) − 15, we pair the factors so that:",["the sums of constants are equal (2 + 5 = 3 + 4)","the products are equal","x cancels","all constants are added"],0,"Book example 13."],["(x + 2)(x + 5) gives x² + 7x + 10 and (x + 3)(x + 4) gives:",["x² + 7x + 12","x² + 7x + 10","x² + 12x + 7","x² + 6x + 12"],0,"Book example 13."],["In example 13, we let y equal:",["x² + 7x","x² + 5x","x + 7","x²"],0,"Substitute y = x² + 7x."],["(x² + 5x + 4)(x² + 5x + 6) − 3: we substitute y =",["x² + 5x","x² + 4","x + 5","x² + 6"],0,"Book example 12."],["Then the expression becomes (y + 4)(y + 6) − 3 =",["y² + 10y + 21","y² + 10y + 24","y² + 21","y² + 10y + 27"],0,"24 − 3 = 21."],["y² + 10y + 21 factorises to:",["(y + 3)(y + 7)","(y + 1)(y + 21)","(y − 3)(y − 7)","(y + 10)(y + 1)"],0,"3 × 7 = 21."],["Type II expressions like a⁴ + 4b⁴ are factorised by:",["completing the square","common factors","division","the cube rule"],0,"Add and subtract a middle term."],["x⁴ + x²y² + y⁴ factorises to:",["(x² + xy + y²)(x² − xy + y²)","(x² + y²)²","(x + y)⁴","(x² − y²)²"],0,"(x² + y²)² − x²y²."]]},
"maths4.4":{"s":"Maths","label":"Ch 4.1.3 Types IV and V: perfect cubes, sum and difference of cubes","q":[["a³ + b³ factorises to:",["(a + b)(a² − ab + b²)","(a + b)(a² + ab + b²)","(a − b)(a² + ab + b²)","(a + b)³"],0,"Sum of cubes identity."],["a³ − b³ factorises to:",["(a − b)(a² + ab + b²)","(a − b)(a² − ab + b²)","(a + b)(a² − ab + b²)","(a − b)³"],0,"Difference of cubes identity."],["8x³ + 27 factorises to:",["(2x + 3)(4x² − 6x + 9)","(2x + 3)(4x² + 6x + 9)","(2x − 3)(4x² + 6x + 9)","(8x + 27)(x + 1)"],0,"Book example 17."],["y³ − 27 factorises to:",["(y − 3)(y² + 3y + 9)","(y − 3)(y² − 3y + 9)","(y + 3)(y² − 3y + 9)","(y − 3)³"],0,"Difference of cubes."],["(a + b)³ expands to:",["a³ + 3a²b + 3ab² + b³","a³ + b³","a³ + 3ab + b³","a³ + 2a²b + 2ab² + b³"],0,"Perfect cube."],["8x³ + 60x² + 150x + 125 factorises to:",["(2x + 5)³","(2x + 5)²","(8x + 125)(x + 1)","(4x + 5)³"],0,"Book example 15: 2x and 5."],["x³ − 18x² + 108x − 216 factorises to:",["(x − 6)³","(x + 6)³","(x − 6)²(x + 6)","(x − 18)³"],0,"Book example 16."],["(a − b)³ expands to:",["a³ − 3a²b + 3ab² − b³","a³ − b³","a³ + 3a²b − 3ab² − b³","a³ − 3ab − b³"],0,"Perfect cube."],["x³ + 1 factorises to:",["(x + 1)(x² − x + 1)","(x + 1)(x² + x + 1)","(x − 1)(x² + x + 1)","(x + 1)³"],0,"Sum of cubes."],["64 − x³ factorises to:",["(4 − x)(16 + 4x + x²)","(4 + x)(16 − 4x + x²)","(4 − x)³","(8 − x)(8 + x)"],0,"Difference of cubes."],["27a³ + 1 factorises to:",["(3a + 1)(9a² − 3a + 1)","(3a + 1)(9a² + 3a + 1)","(3a − 1)(9a² + 3a + 1)","(27a + 1)(a² + 1)"],0,"Sum of cubes."],["x³ + 3x² + 3x + 1 equals:",["(x + 1)³","(x + 3)³","(x + 1)(x² + 1)","(x + 1)²"],0,"Perfect cube."],["In a³ + b³, the quadratic factor a² − ab + b² has the sign of ab:",["negative","positive","zero","doubled"],0,"Identity."],["125x³ − 8 factorises to:",["(5x − 2)(25x² + 10x + 4)","(5x − 2)(25x² − 10x + 4)","(5x + 2)(25x² − 10x + 4)","(5x − 2)³"],0,"Difference of cubes."]]},
"maths4.5":{"s":"Maths","label":"Ch 4.3.1: Highest common factor (HCF) of algebraic expressions","q":[["The HCF of algebraic expressions is the:",["greatest expression that divides them without remainder","smallest common multiple","sum of the expressions","product of the expressions"],0,"Book 4.3.1."],["HCF can be found by:",["factorisation and division methods","only addition","only graphs","logarithms"],0,"Book 4.3.1."],["HCF of 6x²y and 9xy² is:",["3xy","18x²y²","3x²y²","xy"],0,"HCF of 6, 9 is 3; lowest powers of x and y."],["HCF of x² − 4 and x² + 4x + 4 is:",["x + 2","x − 2","(x + 2)²","x² − 4"],0,"(x − 2)(x + 2) and (x + 2)²."],["HCF of a² − b² and a² − 2ab + b² is:",["a − b","a + b","(a − b)²","a² − b²"],0,"(a − b)(a + b) and (a − b)²."],["HCF of 12a³b and 18a²b² is:",["6a²b","36a³b²","6ab","3a²b²"],0,"HCF 6, lowest powers."],["HCF of x² + 5x + 6 and x² + 2x − 3 is:",["x + 3","x + 2","x − 1","1"],0,"(x + 2)(x + 3) and (x + 3)(x − 1)."],["In the factorisation method, the HCF is the product of:",["common factors with the lowest powers","all factors with highest powers","only constants","non-common factors"],0,"Method."],["HCF of 4x and 6x² is:",["2x","12x²","2x²","x"],0,"HCF 2, lowest power x."],["HCF of x³ − 1 and x² − 1 is:",["x − 1","x + 1","x² + x + 1","x³ − 1"],0,"(x − 1)(x² + x + 1) and (x − 1)(x + 1)."],["HCF of 15p²q and 25pq³ is:",["5pq","75p²q³","5p²q³","pq"],0,"HCF 5."],["HCF of (x + 1)² and (x + 1)(x − 2) is:",["x + 1","(x + 1)²","x − 2","1"],0,"Common factor."],["If two expressions have no common factor, their HCF is:",["1","0","their product","their sum"],0,"Definition."],["HCF of x² − 9 and x² − 6x + 9 is:",["x − 3","x + 3","(x − 3)²","x² − 9"],0,"(x − 3)(x + 3) and (x − 3)²."]]},
"maths4.6":{"s":"Maths","label":"Ch 4.3.2 to 4.3.3: LCM and the relationship between LCM and HCF","q":[["The LCM of algebraic expressions is the:",["smallest expression divisible by each of them","greatest common divisor","sum of the expressions","difference"],0,"Book 4.3."],["LCM of 6x²y and 9xy² is:",["18x²y²","3xy","54x³y³","18xy"],0,"LCM 18, highest powers."],["The relationship between LCM and HCF of p and q is:",["LCM × HCF = p × q","LCM + HCF = p + q","LCM = HCF","LCM − HCF = p − q"],0,"Book 4.3.3."],["If p × q = x⁴ − 1 and HCF = x − 1, then LCM is:",["(x⁴ − 1)/(x − 1)","x − 1","x⁴ − 1","1"],0,"LCM = pq ÷ HCF."],["LCM of x² − 4 and x² + 4x + 4 is:",["(x − 2)(x + 2)²","(x + 2)","(x − 2)(x + 2)","(x + 2)²"],0,"Highest powers."],["LCM of a and b when they have no common factor is:",["ab","1","a + b","a"],0,"Product."],["LCM of 4x and 6x² is:",["12x²","2x","24x³","12x"],0,"LCM 12, highest power."],["LCM is found by taking all factors with their:",["highest powers","lowest powers","sums","differences"],0,"Method."],["If HCF = x + 3 and LCM = (x + 3)(x − 1)(x + 2) and one expression is x² + 5x + 6, the other is:",["x² + 2x − 3","x² − 1","x + 3","x² + x − 2"],0,"pq = HCF × LCM."],["LCM of x² − 1 and x + 1 is:",["x² − 1","x + 1","(x + 1)²","x − 1"],0,"x² − 1 is divisible by x + 1."],["HCF of two expressions is 2x and LCM is 12x³. If one is 4x², the other is:",["6x²","3x","6x","12x"],0,"2x × 12x³ ÷ 4x² = 6x²."],["LCM of 3a²b and 4ab² is:",["12a²b²","12ab","7a²b²","ab"],0,"Highest powers."],["LCM of (x − 1)² and (x − 1)(x + 2) is:",["(x − 1)²(x + 2)","(x − 1)","(x − 1)(x + 2)","(x + 2)²"],0,"Highest powers."],["LCM of x and x² is:",["x²","x","x³","1"],0,"Highest power."]]},
"maths4.7":{"s":"Maths","label":"Ch 4.4: Square root of algebraic expressions and real-world factorisation","q":[["The square root of a perfect square expression can be found by:",["factorisation and division","logarithms","Venn diagrams","only guessing"],0,"Book 4.4."],["√(x² + 6x + 9) equals:",["±(x + 3)","x + 9","x − 3","x² + 3"],0,"Perfect square (x + 3)²."],["√(4x² − 12x + 9) equals:",["±(2x − 3)","2x + 3","4x − 3","2x − 9"],0,"(2x − 3)²."],["√(9a²b⁴) equals:",["±3ab²","9ab²","3a²b⁴","±3a²b"],0,"Square root of each factor."],["√(x² + 2xy + y²) equals:",["±(x + y)","x − y","x² + y²","2xy"],0,"(x + y)²."],["The square root of an expression has:",["two values, positive and negative","only a positive value","only a negative value","no value"],0,"± sign."],["√(16x⁴) equals:",["±4x²","4x","16x²","±2x²"],0,"(4x²)²."],["√(x⁴ + 2x² + 1) equals:",["±(x² + 1)","x² − 1","x + 1","x⁴ + 1"],0,"(x² + 1)²."],["A rectangle's area is x² + 7x + 12. If one side is x + 3, the other side is:",["x + 4","x + 3","x + 12","x + 7"],0,"Factorise the area."],["A square's area is 9x² + 12x + 4. Its side is:",["3x + 2","9x + 2","3x + 4","x + 2"],0,"(3x + 2)²."],["√(25 − 10x + x²) equals:",["±(5 − x)","5 + x","25 − x","x − 25"],0,"(5 − x)²."],["In the division method, the first term of the root is the square root of the:",["first term of the expression","last term","middle term","coefficient"],0,"Division method."],["Factorisation helps in real life to:",["break complex expressions into simpler factors for finance, engineering and business","avoid calculations","find logarithms","draw Venn diagrams"],0,"Book introduction."],["√(a²/b²) equals:",["±a/b","a²/b","a/b²","ab"],0,"Root of numerator and denominator."]]},
"phys1.1":{"s":"Physics","label":"Ch 1.1 to 1.3: Physical quantities, base and derived quantities, SI units","q":[["Quantities that can be measured with instruments are called:",["physical quantities","non-physical quantities","emotions","units"],0,"Book 1.1."],["Which one is a non-physical quantity?",["Colour","Distance","Density","Temperature"],0,"Book MCQ 1.4."],["Love, fear and beauty are examples of:",["non-physical quantities","base quantities","derived quantities","SI units"],0,"Book 1.1."],["Quantities selected by scientists to play a key role are called:",["base quantities","derived quantities","non-physical quantities","prefixes"],0,"Book 1.2."],["Speed is a derived quantity that depends on:",["distance and time","mass and time","mass and volume","temperature"],0,"Book 1.2."],["Density is described in terms of:",["mass and volume","length and time","force and area","current and time"],0,"Book 1.2."],["A measurement is a process of comparing an unknown quantity with a:",["widely accepted standard quantity","guess","similar object","non-physical quantity"],0,"Book 1.2."],["A measurement consists of two parts:",["a number and a unit","a unit and a prefix","a symbol and a name","a base and a power"],0,"Book 1.2."],["The SI system of seven base units was recommended in:",["1961","1971","1901","1999"],0,"Book 1.3."],["The SI unit of temperature is the:",["kelvin","degree Celsius","joule","newton"],0,"Book table 1.2."],["The SI unit of intensity of light is the:",["candela","lux","watt","mole"],0,"Book table 1.2."],["The SI unit of amount of substance is the:",["mole","kilogram","litre","ampere"],0,"Book table 1.2."],["The SI unit of electric current is the:",["ampere","volt","coulomb","ohm"],0,"Book table 1.2."],["The SI unit of electric charge (a derived unit) is the:",["coulomb","ampere","volt","newton"],0,"Book table 1.3."],["Units that can be expressed in terms of base units are called:",["derived units","base units","prefixes","standards"],0,"Book 1.3."],[" "phys1.5":{"s":"Physics","label":"Ch 1.9 to 1.13: Errors, uncertainty, significant figures, precision, accuracy, rounding off","q":[["The three types of experimental errors are:",["human, systematic and random","zero, parallax and human","large, small and medium","positive, negative and zero"],0,"Book 1.9."],["Errors due to reaction time in starting a stopwatch are:",["human errors","systematic errors","random errors","zero errors"],0,"Book 1.9."],["Zero error and poor calibration cause:",["systematic errors","random errors","human errors","no errors"],0,"Book 1.9."],["Errors from sudden changes in temperature, pressure or voltage are:",["random errors","systematic errors","human errors","parallax errors"],0,"Book 1.9."],["The effect of random errors is reduced by:",["taking several readings and finding the average","using a different unit","ignoring readings","using one reading"],0,"Book 1.9."],["For a metre rule calibrated in mm, the maximum uncertainty is:",["± 0.05 cm","± 1 cm","± 0.1 mm","± 0.01 cm"],0,"Book 1.10: half the least count."],["Significant figures are:",["the accurately known digits and the first doubtful digit","all zeros","only the first digit","digits after the decimal only"],0,"Book 1.11."],["How many significant figures are in 5.06 m?",["3","2","1","4"],0,"Book rule (a)."],["How many significant figures are in 0.0034 m?",["2","4","5","3"],0,"Book rule (b)."],["How many significant figures are in 2.40 mm?",["3","2","1","4"],0,"Book rule (c)."],["How many significant figures are in 3.420 × 10⁴ m?",["4","3","5","2"],0,"Book problem 1.6."],["Precision refers to how:",["close a group of measurements are to each other","close a value is to the true value","large the measurement is","many units are used"],0,"Book 1.12."],["Accuracy refers to how close a measurement is to the:",["true or accepted value","other measurements","least count","zero"],0,"Book 1.12."],["The smaller the least count, the:",["more precise the measurement","less precise","more er
