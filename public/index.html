"phys3.1":{"s":"Physics","label":"Ch 3.1: Concept of force, contact and non-contact forces","q":[["Dynamics is concerned with the:",["forces that produce change in motion","motion without forces","heat in bodies","light"],0,"Book introduction."],["A force is a push or a pull that:",["starts, stops or changes the speed or direction of a body","only stops a body","has no effect","only exists in space"],0,"Book 3.1."],["The two major types of forces are:",["contact and non-contact forces","big and small forces","fast and slow forces","electric and nuclear only"],0,"Book 3.1."],["The force that resists motion when two surfaces touch is:",["friction","thrust","tension","gravity"],0,"Book 3.1."],["The resistive force on a body moving through a fluid is:",["drag","tension","normal force","elastic force"],0,"Book 3.1."],["The upward force exerted by a liquid on an immersed object (book) is called:",["thrust","drag","tension","friction"],0,"Book 3.1: a ship floats due to this force."],["The reaction force from a surface, acting perpendicular to it, is the:",["normal force","drag","thrust","tension"],0,"Book 3.1: also called support force."],["The force experienced by a rope when it is pulled is:",["tension","drag","thrust","normal force"],0,"Book 3.1."],["Rubber bands, springs and trampolines show:",["elastic force","friction","drag","magnetic force"],0,"Book 3.1."],["Non-contact forces are also called:",["field forces or action-at-a-distance forces","contact forces","normal forces","tension forces"],0,"Book 3.1."],["Which is a non-contact force?",["Gravitational force","Friction","Tension","Air resistance"],0,"Book 3.1."],["The value of G, the constant of gravitation, is:",["6.67 × 10⁻¹¹ N m² kg⁻²","9.8 N kg⁻¹","10 N kg⁻¹","3 × 10⁸ N m² kg⁻²"],0,"Book 3.1."],["In electrostatic force, opposite charges:",["attract each other","repel each other","do nothing","become neutral"],0,"Book 3.1."],["A magnet attracts materials like:",["iron, nickel and cobalt","copper and wood","glas "urdu5.1":{"s":"Urdu","label":"سبق 5 حصہ 1: کلیم اور مرزا ظاہر دار بیگ (مصنف، آغاز)","q":[["سبق ''کلیم اور مرزا ظاہر دار بیگ'' کس ناول سے لیا گیا ہے؟",["توبۃ النصوح","مراۃ العروس","ابن الوقت","بنات النعش"],0,"مشق سوال 2 (الف)۔"],["ناول ''توبۃ النصوح'' کے مصنف:",["ڈپٹی نذیر احمد","سر سید احمد خاں","سید سلیمان ندوی","مولوی عبدالحق"],0,"سبق 5۔"],["اردو کے پہلے ناول نگار کسے مانا جاتا ہے؟",["ڈپٹی نذیر احمد","مرزا غالب","سر سید احمد خاں","پریم چند"],0,"تعارفِ مصنف۔"],["ڈپٹی نذیر احمد کس ضلع کے گاؤں ''ریہڑ'' میں پیدا ہوئے؟",["بجنور","میرٹھ","پٹنہ","علی گڑھ"],0,"تعارفِ مصنف۔"],["ناول ''توبۃ النصوح'' کا موضوع:",["اولاد کی تربیت میں والدین کی ذمہ داریاں","جنگِ آزادی","تعلیمِ نسواں","سیاحت"],0,"سبق کا تعارف۔"],["کلیم کون تھا؟",["نصوح کا بڑا بیٹا","مرزا کا بھائی","کوتوال","نصوح کا نوکر"],0,"سبق کا تعارف۔"],["نصوح کی بیوی کا نام:",["فہمیدہ","اکبری","اصغری","نعیمہ"],0,"سبق کا تعارف۔"],["کلیم کس فن میں مشہور تھا؟",["شاعری","مصوری","خطاطی","تجارت"],0,"وہ اپنے وقت کا معروف شاعر تھا۔"],["مرزا ظاہر دار بیگ اپنے آپ کو کس کا وارث بتاتا تھا؟",["جمعدار صاحب کا","نواب صاحب کا","کوتوال کا","بادشاہ کا"],0,"سبق کا متن۔"],["مرزا ظاہر دار بیگ نے کلیم کو جس مسجد میں ٹھہرایا، وہ تھی:",["ویران اور وحشت ناک","آباد اور پُر رونق","کشادہ اور خوش گوار","تنگ و تاریک"],0,"کتاب کا MCQ (i)۔"],["مرزا نے کلیم کو بتایا کہ آج ان کی بیوی ہے شدید:",["علیل","غصے میں","فکرمند","دباؤ میں"],0,"کتاب کا MCQ (ii)۔"],["مرزا ظاہر دار بیگ کا اصل گھر کیسا تھا؟",["اُپلوں کی ٹال کے برابر ایک چھوٹا سا کچا مکان","دو ہری حویلی","بڑا محل","باغ والا بنگلہ"],0,"لونڈی کا بیان۔"],["مرزا نے کہا: ''آپ کو میری نسبت سخن سازی کا احتمال ہونا ...''",["سخت تعجب کی بات ہے","سخت غصے کی بات ہے","تشویش ناک بات ہے","سخت حیرت کی بات ہے"],0,"کتاب کا MCQ (iii)۔"],["مرزا نے چراغ کیوں نہ جلوایا؟ اس کا بہانہ تھا کہ:",["پروانے جمع ہو جائیں گے اور ابابیلیں گرنے لگیں گی","تیل ختم ہے","چراغ ٹوٹا ہوا ہے","روشنی سے بیوی جاگ جائے گی"],0,"سبق کا متن۔"]],"rtl":true},

"L:chem1.1":{"s":"Chemistry","label":"Ch 1 part 1: Branches of chemistry, states of matter","q":[["Chemistry is the study of:",["the composition, structure, properties and changes of matter","living things only","stars and planets only","energy only"],0,"Chemistry studies what matter is made of, how it is arranged, how it behaves and how it changes."],["The branch of chemistry that studies carbon compounds is:",["Inorganic chemistry","Organic chemistry","Physical chemistry","Nuclear chemistry"],1,"Organic chemistry deals with compounds of carbon (except simple ones like CO2 and carbonates)."],["The study of chemical processes inside living organisms is:",["Biochemistry","Geochemistry","Astrochemistry","Analytical chemistry"],0,"Biochemistry studies the chemistry of life processes."],["The branch that separates, identifies and measures the amount of substances is:",["Analytical chemistry","Organic chemistry","Industrial chemistry","Polymer chemistry"],0,"Analytical chemistry answers what is in a sample and how much."],["Which state of matter has a fixed shape and a fixed volume?",["Gas","Liquid","Solid","Plasma"],2,"Solid particles are tightly packed in fixed positions."],["Liquids have:",["a fixed volume but no fixed shape","a fixed shape and fixed volume","no fixed volume and no fixed shape","a fixed shape but no fixed volume"],0,"Liquids take the shape of their container but keep their volume."],["In which state do particles move the fastest?",["Solid","Liquid","Gas","All the same"],2,"Gas particles have the most kinetic energy and move freely."],["The branch that deals with the design and making of medicines is:",["Medicinal chemistry","Environmental chemistry","Geochemistry","Nuclear chemistry"],0,"Medicinal chemistry designs and develops drugs."],["Geochemistry studies:",["the chemical composition of the Earth's rocks and minerals","chemicals in stars","reaction rates","polymers"],0,"Geochemistry studies the chemistry of the Earth."],["Compounds of most elements other than carbon are studied in:",["Inorganic chemistry","Organic chemistry","Biochemistry","Polymer chemistry"],0,"Inorganic chemistry covers minerals, metals, salts and other non-carbon compounds."]]},
"L:maths1.1":{"s":"Maths","label":"Ch 1 part 1: Rational and irrational numbers, decimals","q":[["Which of these is irrational?",["√2","1/2","0.25","√9"],0,"√2 = 1.41421... is non-terminating and non-recurring."],["0.333... written as p/q is:",["1/3","3/10","33/100","3/100"],0,"x = 0.333..., 10x = 3.333..., so 9x = 3 and x = 1/3."],["0.75 as a fraction is:",["3/4","7/5","75/10","1/75"],0,"0.75 = 75/100 = 3/4."],["π is:",["irrational","rational","an integer","a natural number"],0,"π cannot be written as p/q; 22/7 is only an approximation."],["A non-terminating, non-recurring decimal represents a/an:",["irrational number","rational number","integer","whole number"],0,"Rational numbers always terminate or recur."],["0.444... (0.4 recurring) equals:",["4/9","4/10","2/5","4/99"],0,"x = 0.444..., 10x = 4.444..., 9x = 4."],["Which of these is rational?",["√16","√3","√5","π"],0,"√16 = 4 = 4/1."],["The set of real numbers is made of:",["rational and irrational numbers","only integers","only fractions","only natural numbers"],0,"Real numbers = rationals together with irrationals."],["Every integer is also a:",["rational number","irrational number","prime number","natural number"],0,"Any integer n can be written as n/1."],["2.353535... is:",["rational","irrational","not a real number","an integer"],0,"A recurring decimal is rational."]]},
"L:eng1.1":{"s":"English","label":"Unit 1 part 1: The Saviour of Mankind (reading)","q":[["The Holy Prophet (PBUH) was born in:",["Makkah","Madina","Taif","Damascus"],0,"He was born in Makkah."],["Even before prophethood he was known as:",["Al-Sadiq and Al-Amin","Al-Farooq","Saifullah","Al-Siddiq only"],0,"The truthful and the trustworthy."],["The first revelation came to him in:",["the Cave of Hira","the Cave of Thaur","Masjid-e-Nabvi","Taif"],0,"Angel Jibrael brought the first revelation in Hira."],["He was declared a prophet at the age of:",["40","25","63","30"],0,"Prophethood began at 40."],["He migrated from Makkah to:",["Madina","Taif","Abyssinia","Jerusalem"],0,"This migration is called the Hijrah."],["The Hijrah took place in:",["622 AD","570 AD","632 AD","610 AD"],0,"The Islamic calendar starts from the Hijrah."],["When Makkah was conquered, the Holy Prophet (PBUH):",["forgave his enemies","punished all his enemies","left the city","destroyed the houses"],0,"He announced a general amnesty."],["Before Islam, Arab society was full of:",["ignorance, tribal fighting and injustice","peace and learning","science and trade only","kings and empires"],0,"This period is called the age of ignorance."],["'Rahmat-ul-lil-Aalameen' means:",["mercy for all the worlds","leader of Arabia","the last messenger","the trustworthy"],0,"The Quran calls him a mercy for all the worlds."],["The Holy Prophet (PBUH) passed away at the age of:",["63","60","40","70"],0,"He passed away in 632 AD at 63."]]},
"L:chem1.2":{"s":"Chemistry","label":"Ch 1 part 2: Plasma, intermediate states, phase changes","q":[["Plasma is often called the:",["fourth state of matter","first state of matter","solid state","liquid state"],0,"After solid, liquid and gas, plasma is the fourth state."],["Plasma forms when a gas is:",["heated to a very high temperature or given an electric discharge","cooled to a very low temperature","compressed into a solid","dissolved in water"],0,"High energy strips electrons from atoms, ionising the gas."],["A natural example of plasma on Earth is:",["Lightning","Ice","Sea water","Sand"],0,"Lightning is a huge electric discharge that ionises air."],["Liquid crystals are used in:",["LCD screens","Light bulbs filaments","Batteries","Thermometers bulbs"],0,"LCD means liquid crystal display."],["The change of a solid into a liquid on heating is called:",["Melting","Freezing","Condensation","Deposition"],0,"Melting happens at the melting point."],["The change of a gas into a liquid on cooling is called:",["Condensation","Evaporation","Sublimation","Melting"],0,"Water vapour condensing on a cold glass is an example."],["Dry ice (solid carbon dioxide) changes directly into gas. This is:",["Sublimation","Melting","Boiling","Condensation"],0,"Dry ice sublimes without becoming a liquid."],["While a pure solid is melting, its temperature:",["stays constant","keeps rising","keeps falling","becomes zero"],0,"Heat supplied is used to break the solid structure, so temperature stays at the melting point."],["Evaporation differs from boiling because evaporation:",["happens only at the surface and at any temperature","happens throughout the liquid","happens only at the boiling point","needs a flame"],0,"Boiling occurs throughout the liquid at one fixed temperature; evaporation is a surface process."],["A supercritical fluid exists above the:",["critical temperature and critical pressure","melting point","freezing point","triple point only"],0,"Above both critical values, liquid and gas cannot be told apart."]]},
"L:phys1.1":{"s":"Physics","label":"Ch 1 part 1: Physical quantities, base and derived, SI units","q":[["Which of these is a base quantity?",["Mass","Velocity","Force","Area"],0,"Mass is one of the 7 SI base quantities; the others are derived."],["How many base quantities are there in the SI system?",["7","5","3","10"],0,"Length, mass, time, current, temperature, amount of substance, luminous intensity."],["The SI unit of length is the:",["metre","centimetre","kilometre","inch"],0,"Metre (m)."],["The SI unit of temperature is the:",["kelvin","degree Celsius","degree Fahrenheit","joule"],0,"Kelvin (K) is the SI base unit."],["The SI unit of amount of substance is the:",["mole","kilogram","litre","candela"],0,"Mole (mol)."],["Force is a:",["derived quantity","base quantity","non-physical quantity","unit"],0,"Force depends on mass, length and time (kg m s^−2)."],["The SI unit of electric current is the:",["ampere","volt","ohm","watt"],0,"Ampere (A) is a base unit."],["The SI unit of luminous intensity is the:",["candela","lux","watt","kelvin"],0,"Candela (cd)."],["The SI unit of speed is:",["m s^−1","m s^−2","km","s m^−1"],0,"Speed = distance ÷ time."],["Which of these is NOT a physical quantity?",["Honesty","Length","Time","Mass"],0,"Physical quantities can be measured; honesty cannot."]]},

l quantities easily", "Sub-multiples: milli m, micro μ, nano n; multiples: kilo k, mega M, giga G"]], ["What is meant by zero error in Vernier callipers?", ["When the jaws are closed the zero of the Vernier scale does not coincide with the main scale zero", "Correction: subtract positive and add negative zero error"]], ["Differentiate between precision and accuracy.", ["Precision: how close repeated measurements are to each other", "Accuracy: how close a measurement is to the true value"]]]}, {"name": "Constructed response (4 marks each)", "marks": 4, "qs": [["A screw gauge has a pitch of 1 mm and 100 divisions on its circular scale. Find its least count. Why is it better to place an object close to the metre scale?", ["LC = pitch / number of divisions", "= 1 mm / 100 = 0.01 mm", "Placing close avoids parallax error", "Eye should be vertically above the mark"]], ["You have a metre scale and a bundle of pencils. How can you measure the diameter of one pencil with precision like Vernier callipers?", ["Place a number of pencils (e.g. 20) side by side touching each other", "Measure total width with the metre scale", "Divide by the number of pencils", "Error per pencil is reduced, giving better precision"]], ["Identify human, random and systematic errors with one way to reduce each.", ["Human error: careless reading; reduce by careful observation", "Random error: changes in conditions; reduce by repeating and averaging", "Systematic error: faulty instrument or zero error; reduce by correcting/calibrating", "Correct example for each"]], ["Write the significant figures in (a) 0.00450 (b) 302 (c) 2.30 × 10^4. Round off 3.4567 to three significant figures.", ["(a) 3", "(b) 3", "(c) 3", "3.46"]]]}, {"name": "Descriptive / long question (8 marks)", "marks": 8, "qs": [["State the similarities and differences between Vernier callipers and a micrometer screw gauge. Describe how a reading is taken with Vernier callipers.", ["Both measure small lengths precisely and both have a main scale and a second scale", "Vernier LC 0.1 mm (0.01 cm); screw gauge LC 0.01 mm", "Screw gauge used for very small thickness/diameter (wires)", "Reading = main scale reading + (coinciding Vernier division × LC)", "Zero error correction applied"]]]}]}}, {"id": "maths-2", "date": "2026-11-13", "subject": "Maths", "chapter": "Ch 2", "title": "Logarithms", "parts": ["maths2.1", "maths2.2", "maths2.3", "maths2.4", "maths2.5"], "subjective": {"note": "Write on paper, closed book. Short questions 2 marks each, constructed response 4 marks each, descriptive 8 marks. Use the marking guide to check.", "sections": [{"name": "Short questions (2 marks each)", "marks": 2, "qs": [["Express in scientific notation: (i) 0.000567 (ii) 734.", ["5.67 x 10^-4", "7.34 x 10^2"]], ["Express in ordinary notation: (i) 2.6 x 10^3 (ii) 8.794 x 10^4.", ["2600", "87,940"]], ["Express in logarithmic form: (i) 3^7 = 2187 (ii) (12)^2 = 144.", ["log3 2187 = 7", "log12 144 = 2"]], ["Express in exponential form: (i) log3 729 = 6 (ii) log2 1024 = 10.", ["3^6 = 729", "2^10 = 1024"]], ["Find the characteristic of log 0.00456 and log 4560.", ["0.00456 = 4.56 x 10^-3: characteristic -3", "4560 = 4.56 x 10^3: characteristic 3"]], ["Write as a single logarithm: 3 log 4 - log 32.", ["= log 64 - log 32", "= log 2"]]]}, {"name": "Constructed response (4 marks each)", "marks": 4, "qs": [["Find the value of x: (i) log4 x = 0.5 (ii) log5 x = 3.", ["x = 4^0.5", "= 2", "x = 5^3", "= 125"]], ["Expand using laws of logarithms: (i) log(x y z) (ii) log(x^2 / y).", ["log x + log y + log z", "product law used", "2 log x - log y", "quotient and power laws used"]], ["If log 2 = 0.3010 and log 3 = 0.4771, find log 6 and log 200.", ["log 6 = log 2 + log 3", "= 0.7781", "log 200 = log 2 + log 100", "= 2.3010"]], ["The magnitude of an earthquake is M = log10(A/A0). If A = 10,000 and A0 = 10, find M.", ["A/A0 = 1000", "M = log 1000", "= log 10^3", "M = 3"]]]}, {"name": "Descriptive / long question (8 marks)", "marks": 8, "qs": function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]))}
function chem(s){return esc(s).replace(/([A-Z][a-z]?)(\d+)/g,(m,a,b)=>a+"<sub>"+b+"</sub>")}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function verdict(p){return p>=80?["good","Secure. Move on to the next chapter."]:p>=60?["warn","Re-study the weak topics below in the Sunday catch-up hour, then retake those questions."]:["bad","Re-learn this chapter, then take a fresh test within one week."]}
function fmtDate(ts){const d=new Date(ts);return d.toLocaleDateString(undefined,{day:"numeric",month:"short"})+" "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})}

function section(name,list,rows,empty){
  if(!list.length) return empty?`<section class="tests"><h2>${name}</h2><p class="muted" style="margin:0">${empty}</p></section>`:"";
  return `<section class="tests" aria-label="${name}"><h2>${name}</h2>${list.map(t=>card(t,rows)).join("")}</section>`;
}
function card(t,rows){
  const st=status(t), last=rows.find(r=>r.testId===t.id);
  const kindChip={mock:"Monthly mock",daily:"Daily quiz",weekly:"Weekly test",chapter:"Chapter test"}[t.kind];
  const head=t.head?esc(t.head):t.kind==="chapter"?`${esc(t.subject)} ${esc(t.chapter)}: ${esc(t.title)}`:(t.kind==="daily"?"Today's topics + yesterday's recall":"Everything studied this week");
  const topics=t.topics?`<div class="note" style="margin-top:4px">${t.topics.map(esc).join(" &middot; ")}${t.recall&&t.recall.length?`<br>Recall: ${t.recall.map(esc).join(" &middot; ")}`:""}</div>`:"";
  const once=t.kind!=="chapter";
  const btn=(once&&last)?`<span class="pill p-${band(last.pct)}">Done &middot; ${last.score}/${last.total}</span>`:st==="open"?`<button class="btn" data-start="${t.id}">${last?"Retake":"Start"}</button>`:st==="closed"?`<span class="pill p-bad">Closed</span>`:`<span class="pill p-warn">Opens ${niceDate(t.date)}</span>`;
  return `<div class="sheet tcard"><div>
    <div class="row" style="gap:8px"><span class="chip">${kindChip}</span><span class="mono muted">${niceDate(t.date)}</span></div>
    <h3 style="margin-top:6px">${head}</h3>
    <div class="meta"><span><b class="num">${t.mcqs.length}</b> MCQs, ${t.mcqMinutes} min</span>${t.subjective?`<span>+ written part, ${t.subjMinutes} min</span>`:""}${last?`<span>Last: <b class="num">${last.score}/${last.total}</b> (${last.pct}%)</span>`:""}</div>
    ${topics}</div>${btn}</div>`;
}

/* ===================== TEST ===================== */
let timerInt=null;
function startTest(id){
  const t=TESTS.find(x=>x.id===id);
  if(status(t)!=="open"){toast("This test is not open today.");return}
  if(t.kind!=="chapter"&&hist.some(r=>r.testId===t.id)){toast("This test has already been taken. It can be taken only once.");renderHome();return}
  const saved=LS.get("draft-"+id,null);
  let order, answers, endAt, attemptId;
  if(saved && saved.endAt>Date.now()){({order,answers,endAt,attemptId}=saved)}
  else{
    order=shuffle(t.mcqs.map((q,i)=>({i,opts:shuffle([0,1,2,3])})));
    answers={}; endAt=Date.now()+t.mcqMinutes*60000;
  }
  view={name:"test",t,order,answers,endAt,attemptId:attemptId||uid()};saveDraft();
  renderTest();
}
function saveDraft(){const v=view;LS.set("draft-"+v.t.id,{order:v.order,answers:v.answers,endAt:v.endAt,attemptId:v.attemptId})}
function renderTest(){
  const {t,order,answers}=view;
  app.innerHTML=`
  <div class="bar"><div class="row" style="gap:8px"><button class="btn ghost" id="back">Leave</button><span class="mono" id="count"></span></div>
    <div class="prog" aria-hidden="true"><i id="pbar"></i></div><span class="timer" id="timer" aria-live="off"></span></div>
  <header class="top"><span class="eyebrow">${esc(t.subject)} &middot; ${esc(t.chapter)}${t.subjective?" &middot; Part A":""}</span><h1>${esc(t.title)}</h1>
    <p class="muted" style="margin:0">${t.mcqs.length} MCQs, ${t.mcqMinutes} minutes. Closed book. Questions and options are shuffled every attempt.</p></header>
  <section class="sheet" id="qs">${order.map((o,k)=>{const q=t.mcqs[o.i];return `
    <div class="q" id="q${k}"><span class="qn">${String(k+1).padStart(2,"0")}</span><div class="qt" ${q[5]?'dir="rtl" lang="ur"':""}>${chem(q[0])}</div>
      <div class="opts" ${q[5]?'dir="rtl" lang="ur"':""} role="group" aria-label="Question ${k+1} options">${o.opts.map((oi,j)=>`
        <button class="opt" data-k="${k}" data-oi="${oi}" aria-pressed="${answers[k]===oi}"><span class="bub">${"ABCD"[j]}</span><span>${chem(q[1][oi])}</span></button>`).join("")}</div></div>`}).join("")}
  </section>
  <div class="row"><button class="btn" id="submit">Submit answers</button><span class="note" id="left"></span></div>`;
  $("#back").onclick=()=>{clearInterval(timerInt);renderHome()};
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k,oi=+b.dataset.oi;view.answers[k]=oi;
    b.parentElement.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b));
    saveDraft();updateProg();
  });
  $("#submit").onclick=()=>{
    const left=t.mcqs.length-Object.keys(view.answers).length;
    if(left>0 && !$("#submit").dataset.sure){$("#submit").dataset.sure="1";$("#submit").textContent="Submit anyway ("+left+" blank)";$("#left").textContent="Blank answers score zero. Tap again to submit.";return}
    finish();
  };
  updateProg();tick();clearInterval(timerInt);timerInt=setInterval(tick,1000);
}
function updateProg(){const n=Object.keys(view.answers).length,T=view.t.mcqs.length;$("#count").textContent=n+"/"+T;$("#pbar").style.width=(n/T*100)+"%"}
function tick(){
  if(view.name!=="test")return;
  const s=Math.max(0,Math.round((view.endAt-Date.now())/1000));
  const el=$("#timer");el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  el.classList.toggle("low",s<300);
  if(s===0){clearInterval(timerInt);toast("Time is up. Part A submitted.");finish()}
}
async function finish(){
  if(view.finishing)return;view.finishing=true;
  clearInterval(timerInt);const sb=$("#submit");if(sb){sb.disabled=true;sb.textContent="Saving..."}
  const {t,order,answers}=view;
  let score=0;const wrongTopics={};
  order.forEach((o,k)=>{if(answers[k]===t.mcqs[o.i][2])score++;else{const tp=t.mcqs[o.i][4];wrongTopics[tp]=(wrongTopics[tp]||0)+1}});
  const total=t.mcqs.length,pct=Math.round(score/total*100);
  const partBTotal=t.subjective?t.subjective.sections.reduce((s,x)=>s+x.marks*(x.name.includes("any two")?2:x.name.includes("any one")?1:x.qs.length),0):0;
  const bySubject={},ans=[];
  order.forEach((o,k)=>{const q=t.mcqs[o.i],sj=q[6]||t.subject,b=bySubject[sj]||(bySubject[sj]={c:0,n:0});b.n++;if(answers[k]===q[2])b.c++;ans.push({q:o.i,a:answers[k]??-1})});
  const timeSec=Math.max(0,Math.round(t.mcqMinutes*60-(view.endAt-Date.now())/1000));
  const rec={attemptId:view.attemptId,testId:t.id,kind:t.kind,testLabel:`${t.subject} ${t.chapter}`,score,total,pct,wrongTopics,bySubject,ans,timeSec,at:Date.now(),partB:null,partBTotal};
  try{localStorage.removeItem("draft-"+t.id)}catch(e){}
  rec._id=await saveResult(rec);
  view={name:"result",t,order,answers,rec};
  renderResult();
}
const API="/api/results";
function uid(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10)}
async function api(method,qs,body,pin){
  const r=await fetch(API+(qs||""),{method,headers:Object.assign({"content-type":"application/json"},pin?{"x-pin":pin}:{}),body:body?JSON.stringify(body):undefined});
  if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e}
  return r.json();
}
async function saveResult(rec){
  const {_id,attemptId,...data}=rec;data.clientId=attemptId||uid();
  try{const res=await api("POST","",data);online=true;hist.push({...data,_id:res._id});return res._id}
  catch(e){online=false;const q=LS.get("queue",[]);q.push(data);LS.set("queue",q);hist.push({...data,_id:"l"+data.clientId});toast("No connection. Result kept on this phone and will be sent later.");return "l"+data.clientId}
}
async function flushQueue(){
  const q=LS.get("queue",[]);if(!q.length)return;
  const left=[];
  for(const d of q){try{await api("POST","",{...d,fromDevice:true})}catch(e){left.push(d)}}
  LS.set("queue",left);
}
async function savePartB(rec,val){
  if(!portalPin){toast("Open the progress portal and enter the PIN to save marks.");return}
  try{await api("PATCH","?id="+encodeURIComponent(rec._id),{partB:val},portalPin);rec.partB=val;toast("Part B marks saved.")}
  catch(e){toast(e.status===401?"Wrong PIN. Open the progress portal again.":"Could not save. Check the connection.")}
}
async function loadHist(){
  try{const res=await api("GET","",null,portalPin||"");online=true;
    const q=LS.get("queue",[]).map(d=>({...d,_id:"l"+d.clientId}));
    hist=res.rows.concat(q);return res.full}
  catch(e){online=false;hist=LS.get("queue",[]).map(d=>({...d,_id:"l"+d.clientId}));return false}
}

const SUBJ_ORDER=["Chemistry","Maths","Physics","English","Urdu","Computer","Islamiyat","Tarjuma tul Quran"];
function band(p){return p>=80?"good":p>=60?"warn":"bad"}
function renderProgress(){
  view={name:"progress"};
  const td=todayISO();
  const rows=hist.slice().sort((a,b)=>a.at-b.at);
  const latest={};rows.forEach(r=>latest[r.testId]=r);
  const due=TESTS.filter(t=>t.date<=td);
  const done=due.filter(t=>latest[t.id]).length;
  const missed=due.filter(t=>!latest[t.id]&&status(t)==="closed").length;
  const avg=rows.length?Math.round(rows.reduce((s,r)=>s+r.pct,0)/rows.length):null;
  const wk=rows.filter(r=>r.at>Date.now()-7*864e5);
  const avg7=wk.length?Math.round(wk.reduce((s,r)=>s+r.pct,0)/wk.length):null;
  // subject accuracy
  const subj={};rows.forEach(r=>Object.entries(r.bySubject||{}).forEach(([k,v])=>{const o=subj[k]||(subj[k]={c:0,n:0,pts:[]});o.c+=v.c;o.n+=v.n;o.pts.push(Math.round(v.c/v.n*100))}));
  const subjList=SUBJ_ORDER.filter(k=>subj[k]).concat(Object.keys(subj).filter(k=>!SUBJ_ORDER.includes(k)));
  // weak topics: wrong counts, all attempts
  const wt={};rows.forEach(r=>Object.entries(r.wrongTopics||{}).forEach(([k,n])=>wt[k]=(wt[k]||0)+n));

  const pendingB=rows.filter(r=>r.partBTotal>0&&r.partB==null);
  app.innerHTML=`
  <header class="top">
    <div class="row" style="justify-content:space-between"><span class="eyebrow">Progress portal &middot; for the checker</span><a class="btn ghost" href="#">Back to tests</a></div>
    <h1>Her progress</h1>
    <p class="muted" style="margin:0">Refreshes every 30 seconds. <button class="btn ghost sm" id="lock">Lock portal</button></p>
  </header>
  <section class="tiles">
    ${tile("Tests done",`${done}<span class="muted">/${due.length}</span>`,"scheduled up to today")}
    ${tile("Average score",avg==null?"&ndash;":avg+"%",rows.length+" attempts",avg)}
    ${tile("Last 7 days",avg7==null?"&ndash;":avg7+"%",wk.length+" attempts",avg7)}
    ${tile("Missed",missed,"daily or weekly tests not taken",missed?20:100)}
  </section>
  <section class="sheet"><h2>Score trend</h2><p class="note" style="margin:4px 0 10px">Every attempt in order. Above 80% is secure, below 60% needs re-learning.</p>${trend(rows)}</section>
  <section class="sheet"><h2>By subject</h2><p class="note" style="margin:4px 0 12px">Share of MCQs answered correctly across all tests.</p>
    ${subjList.length?`<div class="bars">${subjList.map(k=>{const o=subj[k],p=Math.round(o.c/o.n*100);return `
      <div class="barrow"><span class="bl">${esc(k)}</span><div class="track" title="${esc(k)}: ${o.c} of ${o.n} correct (${p}%)"><i style="width:${p}%"></i><b class="mk mk60"></b><b class="mk mk80"></b></div><span class="bv num">${p}%</span><span class="pill p-${band(p)}">${o.c}/${o.n}</span></div>`}).join("")}</div>`:`<p class="muted" style="margin:0">No answers yet.</p>`}
  </section>
  <section class="sheet"><h2>Topics with most mistakes</h2>
    ${weak.length?`<div class="tablebox"><table class="hist"><thead><tr><th>Topic</th><th>Wrong answers</th></tr></thead><tbody>${weak.map(([k,n])=>`<tr><td>${esc(k)}</td><td class="num">${n}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted" style="margin:0">No mistakes recorded yet.</p>`}
  </section>
  ${pendingB.length?`<section class="sheet"><h2>Written parts to mark</h2><div style="display:grid;gap:10px;margin-top:8px">${pendingB.map(r=>`<div class="row" style="justify-content:space-between"><span>${esc(r.testLabel)} <span class="note">${fmtDate(r.at)}</span></span><button class="btn ghost" data-review="${r._id}">Open and mark</button></div>`).join("")}</div></section>`:""}
  <section class="sheet"><h2>Schedule</h2><p class="note" style="margin:4px 0 10px">Every test due up to today. Open any attempt to see each MCQ and her answer.</p>
    <div class="tablebox"><table class="hist"><thead><tr><th>Date</th><th>Test</th><th>MCQs</th><th>Written</th><th>Time</th><th></th></tr></thead><tbody>

function kindName(t){return t.kind==="mock"?`Monthly mock: ${t.subject}`:t.kind==="chapter"?`Chapter test: ${t.subject} ${t.chapter}`:t.kind==="weekly"?"Weekly test":"Daily quiz"}
function tile(label,val,sub,p){return `<div class="sheet tile ${p!=null?"t-"+band(p):""}"><span class="eyebrow">${label}</span><span class="tv num">${val}</span><span class="note">${sub}</span></div>`}
function trend(rows){
  if(rows.length<1)return `<p class="muted" style="margin:0">No attempts yet.</p>`;
  const W=640,H=200,L=34,R=12,T=12,B=26,n=rows.length;
  const x=i=>n===1?L+(W-L-R)/2:L+i*(W-L-R)/(n-1), y=p=>T+(100-p)*(H-T-B)/100;
  const pts=rows.map((r,i)=>[x(i),y(r.pct),r]);
  const grid=[0,60,80,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="${v===60||v===80?"gl ref":"gl"}"/><text x="${L-6}" y="${y(v)+4}" class="ax" text-anchor="end">${v}</text>`).join("");
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const dots=pts.map(p=>`<g class="pt" tabindex="0"><circle cx="${p[0]}" cy="${p[1]}" r="12" class="hit"/><circle cx="${p[0]}" cy="${p[1]}" r="4.5" class="dot"/><title>${esc(p[2].testLabel)}: ${p[2].score}/${p[2].total} (${p[2].pct}%), ${fmtDate(p[2].at)}</title></g>`).join("");
  const last=pts[pts.length-1];
  return `<div class="tablebox"><svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Score trend over ${n} attempts">${grid}<text x="${W-R}" y="${y(80)-4}" class="ax" text-anchor="end">secure</text><text x="${W-R}" y="${y(60)-4}" class="ax" text-anchor="end">re-learn below</text><path d="${path}" class="ln"/>${dots}<text x="${Math.min(last[0],W-R-30)}" y="${last[1]-10}" class="lbl" text-anchor="middle">${last[2].pct}%</text></svg></div>`;
}
function renderReview(id){
  const r=hist.find(x=>x._id===id);if(!r)return;
  const t=TESTS.find(x=>x.id===r.testId);if(!t)return;
  view={name:"review"};
  const wrong=(r.ans||[]).filter(a=>a.a!==t.mcqs[a.q][2]).length;
  app.innerHTML=`
  <header class="top"><div class="row" style="justify-content:space-between"><span class="eyebrow">${esc(kindName(t))} &middot; ${fmtDate(r.at)}</span><button class="btn ghost" id="pback">Back to progress</button></div>
    <h1>${esc(r.testLabel)}</h1>
    <p class="muted" style="margin:0">${r.score}/${r.total} correct (${r.pct}%) &middot; ${wrong} to explain${r.timeSec!=null?" &middot; took "+Math.round(r.timeSec/60)+" min":""}</p></header>
  <div class="row"><button class="btn" id="fw" aria-pressed="true">Mistakes only</button><button class="btn ghost" id="fa" aria-pressed="false">All questions</button></div>
  <section class="sheet" id="rv"></section>
  ${t.subjective?partB(t,r):""}`;
  const draw=onlyWrong=>{
    const list=(r.ans||[]).map((a,k)=>({...a,k})).filter(a=>!onlyWrong||a.a!==t.mcqs[a.q][2]);
    $("#rv").innerHTML=list.length?list.map(a=>{const q=t.mcqs[a.q],ok=a.a===q[2];const rtl=q[5]?'dir="rtl" lang="ur"':"";return `
      <div class="q"><span class="qn">${String(a.k+1).padStart(2,"0")}</span><div class="qt" ${rtl}>${chem(q[0])} <span class="pill ${ok?"p-good":"p-bad"}">${ok?"Correct":a.a<0?"Blank":"Wrong"}</span></div>
      <div class="opts" ${rtl}>${q[1].map((op,oi)=>`<button class="opt ${oi===q[2]?"right":(oi===a.a?"wrong":"")}" disabled><span class="bub">${"ABCD"[oi]}</span><span>${chem(op)}${oi===a.a&&!ok?` <span class="note">(her answer)</span>`:""}</span></button>`).join("")}</div>
      ${ok?"":`<div class="expl" ${rtl}>${chem(q[3])}</div>`}<div class="tag">${esc(q[4])}</div></div>`}).join(""):`<p class="muted" style="margin:0">${onlyWrong?"No mistakes in this attempt.":"No answers stored."}</p>`;
  };
  draw(true);
  $("#fw").onclick=()=>{draw(true);$("#fw").className="btn";$("#fa").className="btn ghost";$("#fw").setAttribute("aria-pressed","true");$("#fa").setAttribute("aria-pressed","false")};
  $("#fa").onclick=()=>{draw(false);$("#fa").className="btn";$("#fw").className="btn ghost";$("#fa").setAttribute("aria-pressed","true");$("#fw").setAttribute("aria-pressed","false")};
  $("#pback").onclick=()=>openPortal();
  const inp=$("#pb");if(inp)$("#pbsave").onclick=()=>{const n=Number(inp.value);if(!(n>=0&&n<=r.partBTotal)){toast("Enter marks from 0 to "+r.partBTotal+".");return}savePartB(r,n)};
  window.scrollTo(0,0);
}

/* ===================== BOOT ===================== */
renderHome();
function route(){if(location.hash==="#progress")openPortal();else{renderHome()}}
window.addEventListener("hashchange",route);
let pollT=null;
async function openPortal(){
  clearInterval(pollT);
  if(!portalPin){return renderPin()}
  const full=await loadHist();
  if(!full){portalPin=null;LS.set("pin",null);return renderPin(online?"Wrong PIN.":"No connection.")}
  renderProgress();
  pollT=setInterval(async()=>{if(view.name!=="progress"){clearInterval(pollT);return}await loadHist();if(view.name==="progress")renderProgress()},30000);
}
function renderPin(msg){
  view={name:"pin"};
  app.innerHTML=`<header class="top"><div class="row" style="justify-content:space-between"><span class="eyebrow">Progress portal</span><a class="btn ghost" href="#">Back to tests</a></div><h1>Enter PIN</h1><p class="muted" style="margin:0">The progress portal is for the checker only.</p></header>
  <form class="sheet row" id="pinf" style="align-items:flex-end"><div class="field"><label for="pin" class="eyebrow">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password"></div><button class="btn" type="submit">Open portal</button>${msg?`<span class="note" style="color:var(--bad)">${esc(msg)}</span>`:""}</form>`;
  $("#pinf").onsubmit=async e=>{e.preventDefault();const p=$("#pin").value.trim();if(!p)return;
    try{await api("GET","?check=pin",null,p);portalPin=p;LS.set("pin",p);openPortal()}catch(err){renderPin(err.status===401?"Wrong PIN.":"No connection.")}};
  $("#pin").focus();
}
(async()=>{
  await flushQueue();
  if(location.hash==="#progress"){dbChecked=true;return openPortal()}
  await loadHist();dbChecked=true;
  if(view.name==="home")renderHome();
})();
</script>
